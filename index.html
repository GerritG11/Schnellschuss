<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141B33">
<title>Schnellschuss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#141B33; --panel:#1F2848; --line:#334070; --foam:#FFF6E0; --muted:#9AA3C7;
  --beer:#FFB627; --beer-d:#C98500; --red:#FF4D5E; --green:#22D37A; --blue:#3B82F6;
  --display: Bungee, Impact, "Arial Black", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--foam);
  font-family:Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.screen{display:none; min-height:100%; flex-direction:column; padding:20px; max-width:520px; margin:0 auto}
.screen.on{display:flex}
button{font-family:inherit; cursor:pointer; color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--beer); outline-offset:3px}

.logo{font-family:var(--display); line-height:.9; margin:8vh 0 6px; font-size:clamp(3rem,16vw,5rem); color:var(--beer); text-shadow:5px 5px 0 var(--red)}
.logo span{display:block}
.tag{color:var(--muted); margin:0 0 36px; font-size:1.05rem}

label{display:block; font-weight:600; margin:0 0 8px}
input{width:100%; font:600 1.2rem Rubik, sans-serif; color:var(--foam); background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:14px 16px}
input::placeholder{color:#6B759D}
.code-in{text-transform:uppercase; letter-spacing:.3em; text-align:center; font-family:var(--display); font-size:1.5rem}
.btn{display:block; width:100%; font-weight:800; font-size:1.15rem; border:0; border-radius:14px; padding:16px; background:var(--beer); color:var(--bg); box-shadow:0 5px 0 var(--beer-d); margin:14px 0 0; text-decoration:none; text-align:center}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--beer-d)}
.btn.ghost{background:transparent; color:var(--foam); box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active{transform:translateY(2px)}
.btn.wa{background:var(--green); box-shadow:0 5px 0 #149356}
.or{display:flex; align-items:center; gap:12px; color:var(--muted); margin:28px 0 20px}
.or::before,.or::after{content:""; flex:1; height:2px; background:var(--line)}
.notice{background:#3A1F2E; border:2px solid var(--red); border-radius:14px; padding:14px; margin:0 0 20px; line-height:1.4}
.err{color:var(--red); min-height:1.4em; margin:10px 0 0; font-weight:600}

.lobby-code{font-family:var(--display); font-size:clamp(3.2rem,18vw,5rem); color:var(--beer); text-align:center; letter-spacing:.08em; margin:4vh 0 0}
.lobby-hint{text-align:center; color:var(--muted); margin:4px 0 24px}
.players{list-style:none; padding:0; margin:18px 0; display:flex; flex-wrap:wrap; gap:8px}
.players li{background:var(--panel); border-radius:999px; padding:9px 16px; font-weight:600}
.players li.off{opacity:.4}
.players li.host::after{content:" 👑"}
.muted{color:var(--muted)}
.spacer{flex:1}

#game{padding:12px 12px 16px}
.topbar{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.topbar .rnd{font-family:var(--display); color:var(--beer); font-size:1.1rem; flex:1}
.icon{background:var(--panel); color:var(--foam); border:0; border-radius:12px; min-width:46px; height:46px; font-size:1.25rem; font-weight:800; padding:0 12px}
#stage{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:62vh; user-select:none; -webkit-user-select:none}

.intro .gname{font-family:var(--display); font-size:clamp(2rem,10vw,3rem); color:var(--beer); line-height:1}
.intro .rule{font-size:1.25rem; max-width:20em; margin:16px auto 26px; line-height:1.45}
.intro .count{font-family:var(--display); font-size:6rem; color:var(--foam); animation:beat 1s infinite}

/* Warte auf Grün */
.pad{position:absolute; inset:0; border-radius:24px; display:flex; align-items:center; justify-content:center; touch-action:none}
.pad.red{background:var(--red)} .pad.green{background:var(--green)} .pad.dark{background:#2A3152}
.padtxt{font-family:var(--display); font-size:clamp(2.6rem,13vw,4.6rem); color:var(--bg); pointer-events:none}

/* Tipp die 7 */
.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(94vw,440px)}
.cell{aspect-ratio:1; border:0; border-radius:12px; background:var(--panel); color:var(--foam); font-family:var(--display); font-size:clamp(1.3rem,7vw,1.9rem); touch-action:none; padding:0}
.cell.hit{background:var(--green); color:var(--bg)} .cell.miss{background:var(--red)}

/* Großer Knopf */
.tapbig{width:min(68vw,280px); aspect-ratio:1; border-radius:50%; border:0; background:var(--beer); color:var(--bg); box-shadow:0 10px 0 var(--beer-d); display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none}
.tapbig b{font-family:var(--display); font-size:clamp(2.4rem,14vw,4.6rem); line-height:1}
.tapbig small{font-weight:800; font-size:1.1rem}
.tapbig:active{transform:translateY(6px); box-shadow:0 4px 0 var(--beer-d)}

/* Maulwurf */
.holes{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:min(88vw,380px)}
.hole{aspect-ratio:1; border-radius:50%; border:0; background:#0C1124; box-shadow:inset 0 10px 0 #060914; position:relative; overflow:hidden; touch-action:none; padding:0}
.hole span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(2.2rem,12vw,3.2rem); transform:translateY(105%); transition:transform .07s; pointer-events:none}
.hole.up span{transform:none}
.hole.bonk{background:#1E6B47} .hole.miss{background:#5A2030}
.score-line{font-family:var(--display); color:var(--beer); font-size:1.6rem; margin-bottom:16px}

/* Bombe */
.task{font-size:1.35rem; font-weight:800; margin-bottom:24px}
.task b{font-family:var(--display); font-weight:400; font-size:1.6rem; display:block; margin-top:6px}
.wires{display:flex; flex-direction:column; gap:16px; width:min(88vw,400px)}
.wire{height:48px; border:0; border-radius:24px; touch-action:none; box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.wire.cut{opacity:.25}
.wire.boom{animation:shake .35s}

/* Bier zapfen */
.glass{position:relative; width:min(46vw,180px); height:min(48vh,320px); border:5px solid #E9EEF9; border-top:0; border-radius:0 0 28px 28px; overflow:hidden; background:rgba(255,255,255,.05); touch-action:none}
.fill{position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(#FFC94A,#E38E00)}
.fill::before{content:""; position:absolute; left:0; right:0; top:-12px; height:14px; background:var(--foam); border-radius:7px}
.fill.empty::before{display:none}
.mark{position:absolute; left:0; right:0; height:4px; margin-bottom:-2px; background:var(--red); z-index:2}
.hint{color:var(--muted); font-weight:600; margin-top:18px}

/* 10-Sekunden-Stopp */
.clock{font-family:var(--display); font-size:clamp(4rem,22vw,7rem); margin-bottom:28px; font-variant-numeric:tabular-nums}

/* Treffer-Zone */
.track{position:relative; width:min(90vw,420px); height:76px; background:var(--panel); border-radius:16px; margin-bottom:32px; overflow:hidden}
.zone{position:absolute; left:42%; width:16%; top:0; bottom:0; background:rgba(34,211,122,.28)}
.zone::after{content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--green)}
.needle{position:absolute; top:8px; bottom:8px; width:8px; margin-left:-4px; background:var(--beer); border-radius:4px}

/* Bierdeckel-Turm */
.tower{position:relative; width:260px; height:min(52vh,360px); overflow:hidden; border-bottom:4px solid var(--line); touch-action:none}
.tin{position:absolute; left:0; right:0; bottom:0; top:0; transition:transform .2s}
.coaster{position:absolute; height:20px; border-radius:6px; background:#E9D3A3; box-shadow:inset 0 -4px 0 #B88A45}
.coaster.mov{background:var(--beer); box-shadow:inset 0 -4px 0 var(--beer-d)}
.coaster.drop{background:#7A3040; opacity:.6; transition:transform .5s, opacity .5s}
.tstat{display:flex; gap:24px; font-family:var(--display); color:var(--beer); font-size:1.3rem; margin-bottom:10px}

/* Perfekter Kreis */
.cv{position:absolute; inset:0; width:100%; height:100%; touch-action:none; border-radius:24px; background:var(--panel)}
.cvhint{position:absolute; top:16px; left:0; right:0; color:var(--muted); font-weight:600; pointer-events:none}

/* Roter Knopf */
.btns4{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(84vw,340px)}
.bigbtn{aspect-ratio:1; border:0; border-radius:26px; box-shadow:inset 0 -10px 0 rgba(0,0,0,.28); touch-action:none}
.bigbtn.picked{outline:6px solid var(--foam); outline-offset:3px}
.bigbtn.dim{opacity:.3}

/* Tauziehen */
.team-lbl{font-family:var(--display); font-size:1.5rem; margin-bottom:4px}
.team-mates{color:var(--muted); font-weight:600; margin-bottom:6px; max-width:22em}
.ropebar{position:relative; width:min(90vw,420px); height:14px; border-radius:7px; margin:22px 0 34px; background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%)}
.knot{position:absolute; top:50%; left:50%; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%; background:var(--foam); border:6px solid var(--bg); transition:left .3s}

/* Feedback & Ergebnis */
.fb{font-family:var(--display); font-size:clamp(2rem,10vw,3.4rem); margin-bottom:12px}
.fb.good{color:var(--green)} .fb.bad{color:var(--red); font-size:clamp(1.6rem,8vw,2.4rem)} .fb.meh{color:var(--beer); font-size:clamp(1.6rem,8vw,2.4rem)}
.wait p{margin:6px 0; font-size:1.1rem}
.wc{color:var(--muted)}
.result{width:100%}
.gsmall{color:var(--muted); font-weight:600; margin-bottom:8px}
.boom{font-family:var(--display); font-size:clamp(1.9rem,9vw,2.9rem); color:var(--beer); line-height:1.1; animation:pop .45s ease-out}
.sub{font-size:1.2rem; font-weight:600; margin-top:12px}
.note{color:var(--muted); font-weight:600; margin-top:8px}
.rows{list-style:none; padding:0; margin:22px 0 0; text-align:left}
.rows li{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:12px; background:var(--panel); margin-bottom:6px; font-weight:600}
.rows li.l{background:#4A2133}
.rows li.f span:last-child{color:var(--red)}
.next{margin-top:18px; color:var(--muted)}

.board{display:none; position:fixed; inset:0; background:rgba(10,14,30,.92); z-index:5; padding:calc(20px + env(safe-area-inset-top,0)) 20px 20px}
.board.open{display:block}
.board-in{max-width:480px; margin:0 auto}
.board h2,.end h2{font-family:var(--display); color:var(--beer); font-weight:400; margin:0 0 16px}
.rank{list-style:none; padding:0; margin:0}
.rank li{display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:12px; padding:12px 14px; margin-bottom:6px; font-weight:600}
.rank .pos{font-family:var(--display); color:var(--muted); width:1.6em}
.rank .nm{flex:1}

.titles{display:grid; gap:10px; margin:0 0 24px}
.title-card{background:var(--panel); border-radius:16px; padding:14px 16px; border-left:6px solid var(--beer)}
.title-card .t{color:var(--muted); font-weight:600}
.title-card .w{font-family:var(--display); font-size:1.5rem; margin-top:2px}

@keyframes pop{0%{transform:scale(.6); opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1); opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }


/* Etappe 3 */
.holes{grid-template-columns:repeat(5,1fr); gap:8px; width:min(92vw,400px)}
.hole span{font-size:clamp(1.4rem,8vw,2rem)}
.full{position:absolute; inset:0; touch-action:none}
.dbl{display:inline-block; font-family:var(--display); color:var(--bg); background:var(--beer); padding:6px 14px; border-radius:10px; margin-bottom:14px; animation:beat 1s infinite}
.status{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.status span{background:var(--panel); border-radius:999px; padding:6px 12px; font-weight:600; font-size:.95rem}
.status .rule{background:#3B2A10; color:var(--beer)}
.icon.on{background:var(--beer); color:var(--bg)}
.icon.dim{opacity:.45}
.sp{width:100%; max-width:440px}
.sp .gname{font-family:var(--display); color:var(--beer); font-size:clamp(1.6rem,8vw,2.4rem); line-height:1.05}
.sp .rule{font-size:1.15rem; margin:12px 0 18px; line-height:1.45}
.sp input{text-align:center}
.qbox{background:var(--panel); border-radius:16px; padding:16px; font-size:1.25rem; font-weight:600; line-height:1.4; margin:10px 0 16px}
.missing{color:var(--muted); font-size:.95rem; margin-top:4px}
.groups{list-style:none; padding:0; margin:18px 0 0; text-align:left}
.groups li{background:var(--panel); border-radius:12px; padding:10px 14px; margin-bottom:6px}
.groups li.pair{border-left:6px solid var(--green)}
.groups li.sel{outline:3px solid var(--beer)}
.groups li b{display:block; font-size:1.05rem}
.groups li small{color:var(--muted); font-weight:600}
.btn.small{padding:12px; font-size:1rem}
.wheelwrap{position:relative; width:min(84vw,330px); aspect-ratio:1; margin:6px auto 16px}
.wheelwrap svg{width:100%; height:100%; display:block}
.pointer{position:absolute; left:50%; top:-6px; margin-left:-14px; width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:26px solid var(--foam); z-index:2}
.roul{font-family:var(--display); font-size:clamp(2rem,10vw,3rem); color:var(--foam); min-height:1.3em}
.lines div{font-weight:600; font-size:1.1rem; margin-top:8px}
.flyscore{position:absolute; top:12px; left:0; right:0; font-family:var(--display); color:var(--beer); font-size:1.6rem; pointer-events:none; z-index:2}

.race{display:flex; flex-direction:column; gap:8px; margin:16px 0; width:100%}
.lane{position:relative; height:46px; border-radius:10px; background:var(--panel); border-left:8px solid; overflow:hidden}
.lane::after{content:""; position:absolute; right:0; top:0; bottom:0; width:8px; background:repeating-linear-gradient(0deg,#FFF6E0 0 6px,#141B33 6px 12px)}
.horse{position:absolute; left:2px; top:3px; font-size:2rem; display:inline-block}
.cell[disabled]{opacity:.85}
</style>
</head>
<body>

<section class="screen on" id="start">
  <h1 class="logo"><span>Schnell</span><span>schuss</span></h1>
  <p class="tag">Blitzschnelle Minispiele. Der Langsamste trinkt.</p>
  <div id="fbNotice"></div>
  <label for="nameIn">Dein Name</label>
  <input id="nameIn" maxlength="14" placeholder="z. B. Gerrit" autocomplete="off">
  <button class="btn" onclick="createRoom()">Raum erstellen</button>
  <div class="or">oder beitreten</div>
  <input id="codeIn" class="code-in" maxlength="4" placeholder="CODE" autocomplete="off">
  <button class="btn ghost" onclick="joinRoom()">Beitreten</button>
  <p class="err" id="startErr"></p>
</section>

<section class="screen" id="lobby">
  <div class="lobby-code" id="lobbyCode"></div>
  <p class="lobby-hint">Raumcode</p>
  <a class="btn wa" id="waBtn" target="_blank" rel="noopener">Per WhatsApp einladen</a>
  <button class="btn ghost" onclick="copyLink()" id="copyBtn">Link kopieren</button>
  <ul class="players" id="lobbyPlayers"></ul>
  <div class="spacer"></div>
  <div id="lobbyAction"></div>
  <button class="btn ghost" onclick="leaveRoom()">Raum verlassen</button>
</section>

<section class="screen" id="game">
  <div class="topbar" id="topbar"></div>
  <div class="status" id="status" style="display:none"></div>
  <div id="stage"></div>
</section>

<section class="screen end" id="end"></section>

<div class="board" id="board" onclick="if(event.target===this)toggleBoard(false)">
  <div class="board-in">
    <h2>Rangliste</h2>
    <ol class="rank" id="boardList"></ol>
    <button class="btn ghost" onclick="toggleBoard(false)">Schließen</button>
  </div>
</div>

  const st = room.meta.status;

function teamsOf(r){
  const ids = shuffle(Object.keys(r.parts || {}).sort(), rng(r.seed + 99));
  return { A: ids.filter((_, i) => i % 2 === 0), B: ids.filter((_, i) => i % 2 === 1) };
}
function fitCanvas(cv, LW, LH){
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const s = Math.min(w / LW, h / LH), ox = (w - LW * s) / 2, oy = (h - LH * s) / 2;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  return { ctx, s, ox, oy, w, h };
}

  kreis: {
    title: 'Perfekter Kreis', rule: 'Mal mit dem Finger in einem Zug einen möglichst perfekten Kreis – am besten in die Mitte des Feldes!', max: 12000, better: 'high',
    show: x => x.v.toFixed(1).replace('.', ',') + ' %',
    fb: res => res.fail ? `<div class="fb bad">😬 ${esc(res.why)}</div>` : `<div class="fb good">${res.v.toFixed(1).replace('.', ',')} % rund</div>`,
    run(el, r, done){
      el.innerHTML = '<canvas class="cv" id="cv"></canvas><div class="cvhint">Mal deinen Kreis in die Mitte des Feldes</div>';
      const cv = $('#cv'), dpr = window.devicePixelRatio || 1;
      cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
      const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
      ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#FFB627';
      let pts = [], drawing = false, finished = false;
      const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
      cv.addEventListener('pointerdown', e => {
        e.preventDefault(); if(finished) return;
        drawing = true; pts = [pos(e)]; ctx.clearRect(0, 0, cv.width, cv.height); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      });
      cv.addEventListener('pointermove', e => { if(!drawing) return; const p = pos(e); pts.push(p); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      const up = () => {
        if(!drawing) return; drawing = false; finished = true;
        if(pts.length < 15){ done({ fail: true, why: 'kein Kreis' }); return; }
        const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length, cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
        const rs = pts.map(p => Math.hypot(p.x - cx, p.y - cy));
        const mean = rs.reduce((s, v) => s + v, 0) / rs.length;
        if(mean < 35){ done({ fail: true, why: 'viel zu klein' }); return; }
        const sd = Math.sqrt(rs.reduce((s, v) => s + (v - mean) ** 2, 0) / rs.length);
        let turn = 0;
        for(let i = 1; i < pts.length; i++){
          let d = Math.atan2(pts[i].y - cy, pts[i].x - cx) - Math.atan2(pts[i-1].y - cy, pts[i-1].x - cx);
          if(d > Math.PI) d -= 2 * Math.PI; if(d < -Math.PI) d += 2 * Math.PI; turn += d;
        }
        const cover = Math.min(1, Math.abs(turn) / (2 * Math.PI));
        const gap = Math.hypot(pts[0].x - pts[pts.length-1].x, pts[0].y - pts[pts.length-1].y) / mean;
        const closePen = gap > 0.4 ? Math.max(0.6, 1 - (gap - 0.4) * 0.4) : 1;
        let score = Math.max(0, 1 - (sd / mean) * 2.2) * cover * closePen * 100;
        score = Math.min(99.9, Math.round(score * 10) / 10);
        ctx.strokeStyle = 'rgba(34,211,122,.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, mean, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#22D37A'; ctx.font = '600 14px Rubik, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Dein Idealkreis', cx, Math.max(16, cy - mean - 10));
        T(() => done({ v: score }), 900);
      };
      cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
      T(() => { if(!finished){ finished = true; drawing = false; done({ fail: true, why: 'kein Kreis' }); } }, 10000);
    }
  },

        for(const o of obs){

          ctx.fillStyle = '#C9CEE0'; ctx.fillRect(ox + 18, 0, 24, top - 26); ctx.fillRect(ox, top - 30, 60, 30);

        ctx.save(); ctx.translate(BX, y); ctx.rotate(Math.max(-0.5, Math.min(0.9, vy / 700)));
        ctx.fillStyle = '#C8935A'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 11, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#A8733E'; ctx.fillRect(-10, -9, 3, 18); ctx.fillRect(-2, -10, 3, 20); ctx.fillRect(6, -9, 3, 18);
        ctx.restore();
        if(over) return false;
      });
      T(() => finish(false), 21000);
    }
  },

  schieben: {
    title: 'Bierglas schieben', rule: 'Wisch das Glas nach oben über die Theke. Es soll so nah wie möglich an der Kante stehen bleiben. Runtergefallen heißt trinken!', max: 16000,
    show: x => x.v.toFixed(1).replace('.', ',') + ' cm vor der Kante',
    fb: res => res.fail ? `<div class="fb bad">😬 ${esc(res.why)}</div>` : `<div class="fb good">${res.v.toFixed(1).replace('.', ',')} cm</div>`,
    run(el, r, done){
      const LW = 300, LH = 560, EDGE = 60, START = 470, GR = 24;
      const fric = 0.0017 + r() * 0.0004;
      el.innerHTML = '<canvas class="cv" id="sc"></canvas><div class="cvhint">Glas nach oben wischen</div>';
      const cv = $('#sc');
      const { ctx, s } = fitCanvas(cv, LW, LH);
      let gy = START, v = 0, state = 'wait', track = [], fallY = 0;
      cv.addEventListener('pointerdown', e => {
        e.preventDefault(); if(state !== 'wait') return;
        state = 'drag'; track = [{ y: e.clientY, t: performance.now() }];
        try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      });
      cv.addEventListener('pointermove', e => {
        if(state !== 'drag') return;
        track.push({ y: e.clientY, t: performance.now() });
        const dy = (track[track.length - 1].y - track[0].y) / s;
        gy = Math.min(START, Math.max(START - 80, START + dy));
      });
      const release = () => {
        if(state !== 'drag') return;
        const tn = performance.now(), recent = track.filter(p => tn - p.t < 110);
        const a = recent[0] || track[0], b = track[track.length - 1];
        const vel = (a.y - b.y) / Math.max(16, b.t - a.t) / s;
        if(vel < 0.08){ state = 'wait'; gy = START; return; }
        v = Math.min(3.5, vel); state = 'slide';
      };
      cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
      let last = performance.now(), sent = false;
      loop(t => {
        const dt = Math.min(40, t - last); last = t;
        if(state === 'slide'){
          gy -= v * dt; v -= fric * dt;
          if(gy < EDGE){ state = 'fall'; }
          else if(v <= 0){ state = 'stop'; if(!sent){ sent = true; T(() => done({ v: Math.round((gy - EDGE) / 4 * 10) / 10 }), 500); } }
        }
        if(state === 'fall'){ fallY += dt * 0.5; if(!sent && fallY > 60){ sent = true; done({ fail: true, why: 'runtergefallen 💥' }); } }
        ctx.fillStyle = '#18203D'; ctx.fillRect(0, 0, LW, LH);
        ctx.fillStyle = '#7A4E26'; ctx.fillRect(40, EDGE, 220, LH - EDGE);
        ctx.strokeStyle = '#6A421F'; ctx.lineWidth = 2;
        for(let i = 0; i < 9; i++){ ctx.beginPath(); ctx.moveTo(60 + i * 22, EDGE); ctx.lineTo(56 + i * 22, LH); ctx.stroke(); }
        ctx.fillStyle = '#FF4D5E'; ctx.fillRect(40, EDGE - 4, 220, 6);
        ctx.fillStyle = '#9AA3C7'; ctx.font = '600 13px Rubik, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('KANTE', 150, EDGE - 14);
        const yy = gy - (state === 'fall' ? fallY : 0), rr = state === 'fall' ? Math.max(6, GR - fallY * 0.3) : GR;
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(150, yy, rr + 4, 0, 7); ctx.fill();
        ctx.fillStyle = '#F2A516'; ctx.beginPath(); ctx.arc(150, yy, rr, 0, 7); ctx.fill();
        ctx.fillStyle = '#FFF6E0'; ctx.beginPath(); ctx.arc(150, yy, rr * 0.6, 0, 7); ctx.fill();
        if(sent && state !== 'slide') return false;
      });
      T(() => { if(state === 'wait' || state === 'drag'){ sent = true; state = 'stop'; done({ fail: true, why: 'nicht geschoben' }); } }, 10000);
    }
  },

  knopf: {

function parseNum(s){
  s = String(s || '').replace(/\s/g, '');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
function normAns(t){
  return t.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]/g, '');
}
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function groupAnswers(rows){
  const items = rows.map(x => ({ id: x.id, text: x.text, n: normAns(x.text) }));
  const parent = items.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  for(let i = 0; i < items.length; i++) for(let j = i + 1; j < items.length; j++){
    const a = items[i].n, b = items[j].n, L = Math.max(a.length, b.length);
    const tol = L >= 8 ? 2 : L >= 4 ? 1 : 0;
    if(a && b && (a === b || lev(a, b) <= tol)) parent[find(i)] = find(j);
  }
  const map = {};
  items.forEach((it, i) => { const k = find(i); (map[k] = map[k] || { ids: [], texts: [] }); map[k].ids.push(it.id); map[k].texts.push(it.text); });
  return Object.values(map).map(g => ({ ids: g.ids, text: [...new Set(g.texts)].join(' / ') })).sort((a, b) => b.ids.length - a.ids.length);
}

function valText(game, row){ const g = GAMES[game]; return g.show ? g.show(row) : row.v + ' ms'; }
function defaultEval(rows, g){
  const ok = rows.filter(x => !x.fail), fails = rows.filter(x => x.fail);
  const hi = g.better === 'high';
  ok.sort((a, b) => hi ? b.v - a.v : a.v - b.v);
  let losers = [];
  if(fails.length) losers = fails.map(x => x.id);
  else if(ok.length > 1){
    const worst = ok[ok.length - 1].v;
    losers = ok.filter(x => x.v === worst).map(x => x.id);
    if(losers.length === ok.length) losers = [];
  }
  const winner = (ok.length && rows.length > 1 && !losers.includes(ok[0].id)) ? ok[0].id : null;
  return { losers, winner, gives: winner ? (g.gives || 0) : 0, rows: ok.concat(fails) };
}

/* ===================== Partner, Regeln, Schilde ===================== */
function activeLinks(n){ return Object.values((room.meta && room.meta.links) || {}).filter(l => l.from < n && n <= l.until).map(l => l.a || []); }
function partnersOf(id, n){ const s = new Set(); activeLinks(n).forEach(g => { if(g.includes(id)) g.forEach(o => { if(o !== id) s.add(o); }); }); return [...s]; }
function activateShield(){
  const me = room.players[pid] || {};
  if(me.shieldOn){ alert('Dein Schutzschild ist schon aktiv. Es wehrt das nächste Mal ab, wenn du trinken müsstest.'); return; }
  if(!(me.shields > 0)){ alert('Du hast gerade kein Schutzschild. Gewinn eins in der Joker-Runde (max. 2 gleichzeitig).'); return; }
  if(confirm('🛡️ Schutzschild jetzt aktivieren? Es wehrt das nächste Mal ab, wenn du trinken müsstest.')){
    roomRef.child('players/' + pid).update({ shields: me.shields - 1, shieldOn: true });
  }
}

/* ===================== Host-Steuerung ===================== */
function hostTick(){
  if(!isHost || !room || room.meta.status !== 'playing' || hostBusy) return;
  const r = room.round, t = now();
  if(!r){ hostBusy = true; startRound().finally(() => hostBusy = false); return; }
  if(r.phase !== 'play') return;
  if(hostSpecial(r, t)) return;
  const g = GAMES[r.game];
  const ans = (room.answers && room.answers['r' + r.n]) || {};
  if(r.game === 'rad'){
    const a = ans[r.spinner];
    if(!a){ if(t > r.startAt + 12000) roomRef.child('answers/r' + r.n + '/' + r.spinner).set({ at: Math.round(t), auto: true }); return; }
    if(t >= a.at + SPIN_MS + 700){ hostBusy = true; evaluate().finally(() => hostBusy = false); }
    return;
  }
  const parts = Object.keys(r.parts || {});
  const all = parts.length > 0 && parts.every(p => ans[p]);
  if((all && t >= r.startAt) || t >= r.startAt + g.max + 1500){ hostBusy = true; evaluate().finally(() => hostBusy = false); }
}
function nextRound(){ if(isHost && !hostBusy && room.round && room.round.phase === 'result'){ hostBusy = true; startRound().finally(() => hostBusy = false); } }
function endRoundNow(){
  if(!isHost || hostBusy || !room.round || room.round.phase !== 'play') return;
  if(!confirm('Runde jetzt für alle beenden?')) return;
  hostBusy = true; evaluate().finally(() => hostBusy = false);
}
async function startRound(){
  const M = room.meta, r = room.round, n = (r ? r.n : 0) + 1;
  const parts = {}; const P = room.players || {};
  Object.entries(P).forEach(([id, p]) => { if(p.online) parts[id] = true; });
  const ids = Object.keys(parts);
  const pick = () => ids[Math.floor(Math.random() * ids.length)];
  const up = {}; let round;
  const base = { n, seed: Math.floor(Math.random() * 1e9), startAt: now() + INTRO_MS, phase: 'play', parts };
  const gapFix = (next, other) => Math.abs(next - other) < 5 ? other + 5 : next;
  if(n >= (M.nextWelle || 1e9)){
    round = Object.assign(base, { game: 'welle', setter: pick() });
    up['meta/nextWelle'] = gapFix(n + rint(17, 23), M.nextJoker || 0);
  } else if(n >= (M.nextJoker || 1e9)){
    const used = (M.usedQ || '').split(',').filter(Boolean).map(Number);
    let free = QS.map((_, i) => i).filter(i => !used.includes(i)); if(!free.length) free = QS.map((_, i) => i);
    const q = free[Math.floor(Math.random() * free.length)];
    round = Object.assign(base, { game: 'joker', q });
    up['meta/usedQ'] = (free.length === QS.length ? [] : used).concat(q).join(',');
    up['meta/nextJoker'] = gapFix(n + rint(17, 23), M.nextWelle || 0);
  } else {
    const keys = Object.keys(GAMES).filter(k => !GAMES[k].special);
    const recent = (M.recent || '').split(',').filter(Boolean);
    let choices = keys.filter(k => !recent.includes(k)); if(!choices.length) choices = keys;
    const g = choices[Math.floor(Math.random() * choices.length)];
    up['meta/recent'] = recent.concat(g).slice(-6).join(',');
    round = Object.assign(base, { game: g });
    if(g === 'rad') round.spinner = pick();
    if(n >= (M.nextDouble || 1e9)){ round.double = true; up['meta/nextDouble'] = n + rint(6, 10); }
  }
  up.round = round; up.answers = null; up.live = null;
  await roomRef.update(up);
}
async function evaluate(){
  const r = room.round, g = GAMES[r.game], P = room.players || {};
  const ans = (room.answers && room.answers['r' + r.n]) || {};
  const rows = Object.keys(r.parts || {}).map(id => {
    const a = ans[id];
    return a ? Object.assign({ id }, a, { fail: !!a.fail }) : { id, fail: true, why: 'keine Reaktion' };
  });
  const res = g.eval ? g.eval(rows, r) : defaultEval(rows, g);
  const up0 = {};
  const base = res.base || {}; (res.losers || []).forEach(id => base[id] = (base[id] || 0) + 1);
  const mult = (r.double && !res.noDouble) ? 2 : 1;
  Object.keys(base).forEach(id => base[id] *= mult);
  if(res.gives) res.gives *= mult;
  if(res.givesList){ res.givesList.forEach(x => x.n *= mult); const top = res.givesList.length ? Math.max(...res.givesList.map(x => x.n)) : 0; res.givesList.filter(x => x.n === top).forEach(x => { if(P[x.id]) up0['players/' + x.id + '/wins'] = (P[x.id].wins || 0) + 1; }); }
  const total = Object.assign({}, base), via = {};
  Object.keys(base).forEach(id => partnersOf(id, r.n).forEach(o => {
    if(!(o in base) && P[o] && (total[o] || 0) < base[id]){ total[o] = base[id]; via[o] = id; }
  }));
  const blocked = Object.keys(total).filter(id => P[id] && P[id].shieldOn);
  const up = up0;
  Object.keys(total).forEach(id => {
    if(!P[id]) return;
    if(blocked.includes(id)){ up['players/' + id + '/shieldOn'] = false; return; }
    up['players/' + id + '/drinks'] = (P[id].drinks || 0) + total[id];
    if(id in base) up['players/' + id + '/losses'] = (P[id].losses || 0) + 1;
  });
  if(res.winner && P[res.winner]){
    up['players/' + res.winner + '/wins'] = (P[res.winner].wins || 0) + 1;
    if(r.game === 'gruen'){ const v = res.rows[0].v, best = P[res.winner].best; if(best == null || v < best) up['players/' + res.winner + '/best'] = v; }
  }
  if(res.shieldTo){
    res.shieldGot = []; res.shieldLost = [];
    res.shieldTo.forEach(id => {
      if(!P[id]) return;
      if((P[id].shields || 0) >= MAX_SHIELDS) res.shieldLost.push(id);
      else { res.shieldGot.push(id); up['players/' + id + '/shields'] = (P[id].shields || 0) + 1; up['players/' + id + '/shieldsWon'] = (P[id].shieldsWon || 0) + 1; }
    });
  }
  if(res.links && res.links.length){
    res.links.forEach((a, k) => { up['meta/links/r' + r.n + '_' + k] = { a, from: r.n, until: r.n + 3 }; });
    up['meta/linkLog/r' + r.n] = res.links;
  }
  Object.assign(res, { base, total, via, blocked, mult });
  up['round/phase'] = 'result';
  up['round/resultAt'] = now();
  up['round/result'] = clean(res);
  await roomRef.update(up);
}
function mergeGroups(i, j){
  const r = room.round, res = r.result, n = r.n;
  const gs = (res.groups || []).map(g => ({ ids: g.ids.slice(), text: g.text }));
  if(!gs[i] || !gs[j] || i === j) return;
  gs[i].ids = gs[i].ids.concat(gs[j].ids); gs[i].text = gs[i].text + ' / ' + gs[j].text; gs.splice(j, 1);
  gs.sort((a, b) => b.ids.length - a.ids.length);
  const links = Object.assign({}, room.meta.links || {});
  Object.keys(links).forEach(k => { if(k.startsWith('r' + n + '_')) delete links[k]; });
  const pairs = gs.filter(g => g.ids.length > 1).map(g => g.ids);
  pairs.forEach((a, k) => { links['r' + n + '_' + k] = { a, from: n, until: n + 3 }; });
  roomRef.update({ 'round/result/groups': gs, 'meta/links': links, ['meta/linkLog/r' + n]: pairs.length ? pairs : null });
}
function endGame(){ if(confirm('Spiel wirklich beenden und zur Siegerehrung?')) roomRef.child('meta').update({ status: 'ended' }); }
function newGame(){
  const up = { 'meta/status': 'lobby', 'meta/recent': null, 'meta/links': null, 'meta/linkLog': null, 'meta/rule': null, 'meta/usedQ': null,
    'meta/nextDouble': null, 'meta/nextWelle': null, 'meta/nextJoker': null, round: null, answers: null, live: null };
  Object.keys(room.players || {}).forEach(id => {
    ['drinks', 'losses', 'wins', 'shields', 'shieldsWon'].forEach(k => up['players/' + id + '/' + k] = 0);
    up['players/' + id + '/best'] = null; up['players/' + id + '/shieldOn'] = false;
  });
  roomRef.update(up);
}

     <button class="icon" onclick="toggleBoard(true)" aria-label="Rangliste">🏆</button>` +
    (isHost ? `<button class="icon" onclick="endGame()" aria-label="Spiel beenden">Ende</button>` : '');
  let st = '';

    const rule = room.meta.rule;
    if(rule && rule.text && r.n <= rule.until) st += `<span class="rule">👑 Regel: ${esc(rule.text)} (bis Runde ${rule.until})</span>`;
  }
  $('#status').innerHTML = st; $('#status').style.display = st ? 'flex' : 'none';

function myAnswer(r){ return room.answers && room.answers['r' + r.n] && room.answers['r' + r.n][pid]; }
function waitHTML(msg){ return `<div class="wait">${msg ? '<p>' + msg + '</p>' : ''}<p class="wc">Warte auf die anderen … <b id="wc"></b></p></div>`; }
function feedbackHTML(game, res){
  const g = GAMES[game];
  if(g.fb) return g.fb(res);
  return res.fail ? `<div class="fb bad">😬 ${esc(res.why)}</div>` : `<div class="fb good">${valText(game, res)}</div>`;
}

function playRound(r){
  const g = GAMES[r.game], stage = $('#stage');
  if(!r.parts || !r.parts[pid]){ stage.innerHTML = waitHTML('Du steigst nächste Runde ein 🍻'); return; }
  const prev = myAnswer(r);
  if(!g.custom && prev){ stage.innerHTML = feedbackHTML(r.game, prev) + waitHTML(''); return; }
  let sent = false;
  const done = res => {
    if(sent) return; sent = true; clearTimers();
    roomRef.child('answers/r' + r.n + '/' + pid).set(clean(res));
    if(r.game === 'tauziehen') roomRef.child('live/r' + r.n + '/' + pid).set(res.taps || 0);
    T(() => { stage.innerHTML = feedbackHTML(r.game, res) + waitHTML(''); updateLive(); }, 450);
  };
  let who = '';
  if(r.game === 'rad') who = `<p class="rule"><b>${nm(r.spinner)}</b> dreht diesmal.</p>`;
  if(r.game === 'welle') who = `<p class="rule"><b>${nm(r.setter)}</b> nennt die Kategorie.</p>`;
  stage.innerHTML = `<div class="intro">${r.double ? '<div class="dbl">⚡ DOPPELRUNDE ⚡</div>' : ''}<div class="gname">${g.title}</div><p class="rule">${g.rule}</p>${who}<div class="count" id="cd"></div></div>`;
  const tick = () => {
    const left = r.startAt - now();
    if(left <= 0){
      clearTimers();
      if(!g.custom && now() > r.startAt + g.max){ done({ fail: true, why: 'zu spät' }); return; }
      stage.innerHTML = '';
      if(g.custom) g.run(stage, rng(r.seed), r);
      else g.run(stage, rng(r.seed), done, r);
    } else {
      const el = $('#cd'); if(el) el.textContent = Math.ceil(left / 1000);
    }
  };
  timers.push(setInterval(tick, 80)); tick();
}

function drinkLines(res){
  const total = res.total || {}, blocked = res.blocked || [], via = res.via || {}, base = res.base || {};
  const byAmt = {};
  Object.keys(base).filter(id => !blocked.includes(id)).forEach(id => { (byAmt[base[id]] = byAmt[base[id]] || []).push(id); });
  const lines = Object.keys(byAmt).sort((a, b) => b - a).map(a => `💥 ${joinNames(byAmt[a])} ${byAmt[a].length > 1 ? 'trinken' : 'trinkt'} ${a}!`);
  const extra = [];
  Object.keys(via).filter(id => !blocked.includes(id)).forEach(id => extra.push(`🔗 ${nm(id)} trinkt ${total[id]} mit (Partner von ${nm(via[id])})`));
  blocked.forEach(id => extra.push(`🛡️ ${nm(id)} wehrt mit dem Schild ab!`));
  return { lines, extra };
}

function showResult(r){
  const res = r.result || {}, g = GAMES[r.game], L = Object.keys(res.base || {});
  const { lines, extra } = drinkLines(res);
  const stage = $('#stage');
  const title = `<div class="gsmall">${g.title}${res.mult > 1 ? ' · ⚡ Doppelrunde' : ''}</div>`;
  const shieldLines = [];
  (res.shieldGot || []).forEach(id => shieldLines.push(`🛡️ ${nm(id)} bekommt ein Schutzschild!`));
  (res.shieldLost || []).forEach(id => shieldLines.push(`🛡️ ${nm(id)} hat schon 2 Schilde – Schild verfällt!`));
  let html = '';

  if(r.game === 'welle'){
    const groups = res.groups || [];
    const pairs = groups.filter(x => x.ids.length > 1);
    const head = pairs.length ? '🔗 Neue Partner!' : '🔗 Keine gleichen Antworten';
    const canMerge = pid === r.setter;
    html = `<div class="result">${title}<div class="gsmall">Kategorie: ${esc(r.category || '–')}</div><div class="boom">${head}</div><div class="lines">${pairs.map(x => `<div>🔗 ${joinNames(x.ids)} sind 3 Runden Partner</div>`).join('')}${lines.map(l => `<div>${l} (nichts geschrieben)</div>`).join('')}${extra.map(l => `<div>${l}</div>`).join('')}</div>
      ${canMerge && groups.length > 1 ? '<p class="note">Du hast die Kategorie gestellt: Tipp zwei Antworten an, die dasselbe meinen, um sie zusammenzuschieben.</p>' : ''}
      <ul class="groups">${groups.map((x, i) => `<li class="${x.ids.length > 1 ? 'pair' : ''}" data-i="${i}"><b>${esc(x.text)}</b><small>${joinNames(x.ids)}</small></li>`).join('')}</ul><div class="next" id="nx"></div></div>`;
    stage.innerHTML = html;
    if(canMerge){
      let sel = null;
      stage.querySelectorAll('.groups li').forEach(li => li.onclick = () => {
        const i = +li.dataset.i;
        if(sel === null){ sel = i; li.classList.add('sel'); return; }
        if(sel === i){ sel = null; li.classList.remove('sel'); return; }
        mergeGroups(Math.min(sel, i), Math.max(sel, i));
      });
    }
    return;
  }

  if(r.game === 'joker'){
    const rows = (res.rows || []).map(x => `<li class="${(res.shieldTo || []).includes(x.id) ? '' : ''}"><span>${nm(x.id)}</span><span>${x.fail || typeof x.num !== 'number' ? 'keine Schätzung' : num(x.num)}</span></li>`).join('');
    const head = shieldLines.length ? shieldLines[0] : '🃏 Keiner hat geschätzt';
    html = `<div class="result">${title}<div class="boom">${head}</div><div class="lines">${shieldLines.slice(1).map(l => `<div>${l}</div>`).join('')}</div><div class="note">Richtige Antwort: ${num(res.answer)}${res.unit ? ' ' + esc(res.unit) : ''}</div><ol class="rows">${rows}</ol><div class="next" id="nx"></div></div>`;
    stage.innerHTML = html;
    return;
  }

  if(r.game === 'pferd'){
    const order = res.order || [0, 1, 2, 3], pay = [3, 2, 1, 0], R3 = rng(r.seed + 77), Tm = {};
    order.forEach((h, place) => { Tm[h] = 9 + place * 0.45 + R3() * 0.2; });
    const wig = HORSES.map(() => ({ a: 0.05 + R3() * 0.05, f: 0.25 + R3() * 0.4, p: R3() * 6 }));
    const medals = ['🥇', '🥈', '🥉', '4.'];
    const pl = order.map((h, place) => {
      const bet = (res.rows || []).filter(x => x.pick === h).map(x => x.id);
      const amt = pay[place] * (res.mult || 1);
      return `<div>${medals[place]} ${HORSES[h].n}${bet.length ? ' – ' + joinNames(bet) + (amt ? (bet.length > 1 ? ' verteilen je ' : ' verteilt ') + amt : (bet.length > 1 ? ' gehen' : ' geht') + ' leer aus') : ''}</div>`;
    }).join('');
    stage.innerHTML = `<div class="result">${title}<div class="boom" id="pfHead">🏇 Das Rennen läuft!</div><div class="race">${HORSES.map((h, i) => `<div class="lane" style="border-left-color:${h.c}"><span class="horse" id="hz${i}">🏇</span></div>`).join('')}</div><div class="lines" id="pfLines" style="visibility:hidden">${pl}${extra.map(l => `<div>${l}</div>`).join('')}</div><div class="next" id="nx"></div></div>`;
    const start = (r.resultAt || now()) + 800, maxT = Math.max(...Object.values(Tm));
    loop(() => {
      const tt = (now() - start) / 1000;
      HORSES.forEach((_, h) => {
        const el = $('#hz' + h); if(!el) return;
        const b = Math.max(0, tt / Tm[h]), w = wig[h];
        const p = Math.max(0, Math.min(1, b + w.a * Math.sin(2 * Math.PI * w.f * tt + w.p) * Math.max(0, Math.min(b, 1 - b)) * 4));
        el.style.transform = `translateX(${p * (el.parentNode.clientWidth - 46)}px) scaleX(-1)`;
      });
      if(tt > maxT + 0.4){
        $('#pfHead').innerHTML = `🏆 ${HORSES[order[0]].n} gewinnt!`; $('#pfLines').style.visibility = 'visible'; pferdDone = r.n; updateLive(); return false;
      }
    });
    return;
  }

  if(r.game === 'schiffe'){
    const head = res.loseSide ? `🍺 ${res.loseSide === 'A' ? 'Team Rot' : 'Team Blau'} muss das Glas exen!` : '⚓ Schiffe versenken vorbei';
    stage.innerHTML = `<div class="result">${title}<div class="boom">${head}</div>${res.ex && res.ex.length ? `<div class="sub">${joinNames(res.ex)}: Ex! 🍺</div>` : ''}<div class="lines">${lines.map(l => `<div>${l} (getroffen)</div>`).join('')}${extra.map(l => `<div>${l}</div>`).join('')}</div>${res.note ? `<div class="note">${esc(res.note)}</div>` : ''}<div class="next" id="nx"></div></div>`;
    return;
  }

  if(r.game === 'rad'){
    const o = RAD.find(x => x.k === res.kind) || RAD[8];
    let body = '';
    if(res.kind === 'opfer'){
      body = `<div class="roul" id="roul"></div><div class="lines" id="radLines" style="visibility:hidden">${extra.map(l => `<div>${l}</div>`).join('')}</div>`;
    } else {
      const all = lines.concat(extra);
      if(res.winner) all.unshift(`🎯 ${nm(res.winner)} verteilt ${res.gives} Schlücke`);
      if(res.links) res.links.forEach(a => all.push(`🔗 ${joinNames(a)} sind 3 Runden Partner`));
      shieldLines.forEach(l => all.push(l));
      if(res.kind === 'niete') all.push('Nichts passiert. Glück gehabt … oder Pech? 😄');
      body = `<div class="lines">${all.map(l => `<div>${l}</div>`).join('')}</div><div id="ruleBox"></div>`;
    }
    html = `<div class="result">${title}<div class="boom">${o.e} ${o.t}!</div><div class="note">${esc(res.note || '')}</div>${body}<div class="next" id="nx"></div></div>`;
    stage.innerHTML = html;
    if(res.kind === 'opfer'){
      const names = Object.keys(r.parts || {}).map(nameOf), el = $('#roul');
      let i = 0, delay = 60;
      const step = () => {
        el.textContent = names[i++ % names.length];
        delay *= 1.12;
        if(delay < 420) T(step, delay);
        else { el.innerHTML = lines.length ? lines[0] : '🛡️ abgewehrt!'; el.style.color = 'var(--beer)'; el.style.animation = 'pop .45s ease-out'; $('#radLines').style.visibility = 'visible'; }
      };
      step();
    }
    if(res.kind === 'regel') renderRuleBox(r);
    return;
  }

  const head = lines.length ? lines[0] : (extra.length ? '🛡️ Abgewehrt!' : '🍀 Diesmal trinkt keiner');
  const more = lines.slice(1).concat(extra);
  let sub = '';
  if(res.winner) sub = res.gives ? `🎯 ${nm(res.winner)} verteilt ${res.gives} Schlücke` : `⚡ Am besten: ${nm(res.winner)}`;
  const rows = (res.rows || []).map(x =>
    `<li class="${x.fail ? 'f' : ''} ${L.includes(x.id) ? 'l' : ''}"><span>${nm(x.id)}</span><span>${x.fail ? esc(x.why || '–') : esc(valText(r.game, x))}</span></li>`).join('');
  stage.innerHTML = `<div class="result">${title}<div class="boom">${head}</div>${more.length ? `<div class="lines">${more.map(l => `<div>${l}</div>`).join('')}</div>` : ''}${sub ? `<div class="sub">${sub}</div>` : ''}${res.note ? `<div class="note">${esc(res.note)}</div>` : ''}<ol class="rows">${rows}</ol><div class="next" id="nx"></div></div>`;
}
function renderRuleBox(r){
  const box = $('#ruleBox'); if(!box) return;
  const rule = room.meta.rule, set = rule && rule.from === r.n;
  if(set){ box.innerHTML = `<div class="qbox">👑 Neue Regel bis Runde ${rule.until}:<br>${esc(rule.text)}</div>`; return; }
  if(pid === r.spinner){
    if($('#ruleIn')) return;
    box.innerHTML = `<p class="rule">Stell eine Regel für die nächsten 5 Runden auf:</p><input id="ruleIn" maxlength="80" placeholder="z. B. Wer flucht, trinkt" autocomplete="off"><button class="btn" id="ruleBtn">Regel festlegen</button>`;
    $('#ruleBtn').onclick = () => { const t = $('#ruleIn').value.trim(); if(!t){ $('#ruleIn').focus(); return; } roomRef.child('meta/rule').set({ text: t, by: pid, from: r.n, until: r.n + 5 }); };
  } else box.innerHTML = `<p class="rule">${nm(r.spinner)} denkt sich eine Regel aus …</p>`;
}

function updateLive(){
  const r = room && room.round; if(!r) return;
  const parts = Object.keys(r.parts || {});
  const ans = (room.answers && room.answers['r' + r.n]) || {};
  const wc = $('#wc');
  if(wc) wc.textContent = parts.filter(p => ans[p]).length + '/' + parts.length;
  const miss = $('#miss');
  if(miss){ const m = parts.filter(p => !ans[p]); miss.textContent = m.length ? 'Fehlt noch: ' + m.map(nameOf).join(', ') : ''; }
  const knot = $('#knot');
  if(knot && r.game === 'tauziehen'){
    const live = (room.live && room.live['r' + r.n]) || {};
    const { A, B } = teamsOf(r);
    const s = ids => ids.reduce((t, id) => t + (live[id] || 0), 0);
    const a = s(A), b = s(B);
    knot.style.left = (50 - ((a - b) / (a + b + 4)) * 45) + '%';
  }
  if(liveHook) liveHook();
  if(r.phase === 'result'){
    if(r.game === 'rad' && r.result && r.result.kind === 'regel') renderRuleBox(r);
    const nx = $('#nx');
    if(nx && r.game === 'pferd' && pferdDone !== r.n){ nx.textContent = ''; }
    else if(nx){
      if(isHost){ if(!$('#nextBtn')) nx.innerHTML = '<button class="btn" id="nextBtn" onclick="nextRound()">Weiter ▶</button>'; }
      else nx.textContent = 'Trinken! 🍻 Der Host macht gleich weiter …';
    }
  }
}

function sortedPlayers(){ return Object.entries(room.players || {}).sort((a, b) => (b[1].drinks || 0) - (a[1].drinks || 0)); }

/* ===================== Ende ===================== */
function renderEnd(){
  viewKey = ''; clearTimers(); toggleBoard(false); show('end');
  const list = sortedPlayers();
  const ent = Object.entries(room.players || {});
  const top = (f, key) => ent.filter(([, p]) => f(p)).sort((a, b) => key(b[1]) - key(a[1]))[0];
  const thirsty = top(p => (p.drinks || 0) > 0, p => p.drinks);
  const fastest = ent.filter(([, p]) => p.best != null).sort((a, b) => a[1].best - b[1].best)[0];
  const winner = top(p => (p.wins || 0) > 0, p => p.wins);
  const unlucky = top(p => (p.losses || 0) > 0, p => p.losses);
  const joker = top(p => (p.shieldsWon || 0) > 0, p => p.shieldsWon);
  const pairCount = {};
  Object.values((room.meta && room.meta.linkLog) || {}).forEach(groups => (groups || []).forEach(g => {
    for(let i = 0; i < g.length; i++) for(let j = i + 1; j < g.length; j++){ const k = [g[i], g[j]].sort().join('|'); pairCount[k] = (pairCount[k] || 0) + 1; }
  }));
  const soul = Object.entries(pairCount).sort((a, b) => b[1] - a[1])[0];
  const card = (t, w) => `<div class="title-card"><div class="t">${t}</div><div class="w">${w}</div></div>`;
  $('#end').innerHTML = `
    <h1 class="logo" style="margin-top:4vh;font-size:clamp(2.4rem,12vw,3.6rem)"><span>Siegerehrung</span></h1>
    <div class="titles">
      ${fastest ? card('⚡ Schnellster Finger', esc(fastest[1].name) + ' · ' + fastest[1].best + ' ms') : ''}
      ${winner ? card('🏅 Die meisten Siege', esc(winner[1].name) + ' · ' + winner[1].wins) : ''}
      ${thirsty ? card('🍺 Durstigster Spieler', esc(thirsty[1].name) + ' · ' + thirsty[1].drinks + ' Schlücke') : ''}
      ${unlucky ? card('🍀 Pechvogel', esc(unlucky[1].name) + ' · ' + unlucky[1].losses + ' verlorene Runden') : ''}
      ${joker ? card('🛡️ Joker-König', esc(joker[1].name) + ' · ' + joker[1].shieldsWon + (joker[1].shieldsWon === 1 ? ' Schild' : ' Schilde')) : ''}
      ${soul ? card('🔗 Seelenverwandte', soul[0].split('|').map(nm).join(' & ') + ' · ' + soul[1] + '× Partner') : ''}
    </div>
    <h2>Endstand</h2>
    <ol class="rank">${list.map(([id, p], i) => `<li><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}</span><span>🍺 ${p.drinks || 0}</span></li>`).join('')}</ol>
    <div class="spacer"></div>
    ${isHost ? '<button class="btn" onclick="newGame()">Neues Spiel</button>' : '<p class="muted" style="text-align:center;margin-top:20px">Der Host kann ein neues Spiel starten.</p>'}
    <button class="btn ghost" onclick="leaveRoom()">Raum verlassen</button>`;
}

const HORSES = [{ n: 'Rot', c: '#FF4D5E' }, { n: 'Blau', c: '#3B82F6' }, { n: 'Gelb', c: '#FFB627' }, { n: 'Grün', c: '#22D37A' }];
const ITEMS = '📱 Handy|📕 Buch|🔑 Schlüssel|⌚ Armbanduhr|⏰ Wecker|👓 Brille|🕶️ Sonnenbrille|☂️ Regenschirm|🕯️ Kerze|🔨 Hammer|🎸 Gitarre|🎺 Trompete|⚽ Fußball|🏀 Basketball|🍕 Pizza|🍌 Banane|🍎 Apfel|🍅 Tomate|🍓 Erdbeere|🍍 Ananas|🥨 Brezel|🍔 Burger|🍦 Eis|🍺 Bier|☕ Kaffee|💡 Glühbirne|✂️ Schere|📷 Kamera|👑 Krone|🚀 Rakete|🚲 Fahrrad|🚗 Auto|🎈 Luftballon|🎁 Geschenk|🎲 Würfel|🎧 Kopfhörer|💻 Laptop|👟 Turnschuh|🎩 Zylinder|🔦 Taschenlampe|🔔 Glocke|⚓ Anker|🧲 Magnet|🔍 Lupe|🔋 Batterie|✏️ Bleistift|🖌️ Pinsel|✉️ Briefumschlag|🔒 Schloss|🥕 Karotte'
  .split('|').map(s => { const i = s.indexOf(' '); return { e: s.slice(0, i), n: s.slice(i + 1) }; });
function retteItems(seed){ return shuffle(ITEMS.map((_, i) => i), rng(seed + 1)).slice(0, 25); }
function retteTarget(seed, step, pool){
  let k = Math.floor(rng(seed + step * 7 + 3)() * 25);
  if(step > 0){ const prev = Math.floor(rng(seed + (step - 1) * 7 + 3)() * 25); if(prev === k) k = (k + 1) % 25; }
  return pool[k];
}
function shipShooter(R){
  const t = teamsOf(R), order = R.first === 'A' ? ['A', 'B'] : ['B', 'A'];
  const side = order[(R.turn || 0) % 2], list = t[side];
  return { id: list[Math.floor((R.turn || 0) / 2) % list.length], side, target: side === 'A' ? 'B' : 'A' };
}
function shipShots(R){ return Object.keys(R.shots || {}).sort((a, b) => +a.slice(1) - +b.slice(1)).map(k => R.shots[k]); }
function curlOrder(R){
  const { A, B } = teamsOf(R), out = [];
  for(let i = 0; i < Math.max(A.length, B.length); i++){ if(A[i]) out.push({ id: A[i], side: 'A' }); if(B[i]) out.push({ id: B[i], side: 'B' }); }
  return out;
}
const CW = 300, CH = 620, SX = 150, SY = 572, HX = 150, HY = 135, GR = 13, HOUSE = 70;
function curlStep(gl){
  let moving = false;
  for(const g of gl){
    if(g.off) continue;
    g.x += g.vx; g.y += g.vy; g.vx *= 0.985; g.vy *= 0.985;
    if(g.vx * g.vx + g.vy * g.vy < 0.0025){ g.vx = 0; g.vy = 0; } else moving = true;
    if(g.x < GR){ g.x = GR; g.vx = -g.vx * 0.6; }
    if(g.x > CW - GR){ g.x = CW - GR; g.vx = -g.vx * 0.6; }
    if(g.y < -GR || g.y > CH + GR){ g.off = true; g.vx = 0; g.vy = 0; }
  }
  for(let i = 0; i < gl.length; i++) for(let j = i + 1; j < gl.length; j++){
    const a = gl[i], b = gl[j]; if(a.off || b.off) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if(d2 > 0 && d2 < 4 * GR * GR){
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if(rv < 0){ const jj = -(1.9) * rv / 2; a.vx -= jj * nx; a.vy -= jj * ny; b.vx += jj * nx; b.vy += jj * ny; moving = true; }
      const ov = (2 * GR - d) / 2; a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
    }
  }
  return moving;
}
function curlSim(shots, upto, record){
  const gl = []; let frames = null;
  for(let k = 0; k < upto; k++){
    const s = shots[k];
    gl.push({ x: SX, y: SY, vx: s.vx, vy: s.vy, side: s.side, id: s.id, off: false });
    const rec = (record && k === upto - 1) ? [gl.map(g => [g.x, g.y, g.off])] : null;
    for(let f = 0; f < 1500; f++){ const m = curlStep(gl); if(rec) rec.push(gl.map(g => [g.x, g.y, g.off])); if(!m) break; }
    if(rec) frames = rec;
  }
  return { gl, frames };
}
function curlShots(R){ return Object.keys(R.shots || {}).sort((a, b) => +a.slice(1) - +b.slice(1)).map(k => R.shots[k]); }
function curlScore(gl){
  const inH = gl.filter(g => !g.off).map(g => ({ ...g, d: Math.hypot(g.x - HX, g.y - HY) })).filter(g => g.d <= HOUSE + GR).sort((a, b) => a.d - b.d);
  if(!inH.length) return null;
  const side = inH[0].side, opp = inH.find(g => g.side !== side);
  const pts = inH.filter(g => g.side === side && (!opp || g.d < opp.d)).length;
  return { side, pts };
}

    run(el, rr, r){

          ctx.fillStyle = '#FFF6E0'; ctx.beginPath(); ctx.arc(p[0], p[1], GR * 0.55, 0, 7); ctx.fill();
          ctx.fillStyle = '#141B33'; ctx.font = '700 10px Rubik, sans-serif'; ctx.textAlign = 'center'; ctx.fillText((nameOf(gl[i].id) || '?')[0], p[0], p[1] + 3.5);

        if(who && !shots[cur] && !R.done){
          ctx.globalAlpha = 0.6; ctx.fillStyle = who.side === 'A' ? '#FF4D5E' : '#3B82F6'; ctx.beginPath(); ctx.arc(SX, SY, GR, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
          const left = Math.max(0, Math.ceil(10 - (now() - (R.turnAt || 0)) / 1000));
          $('#cuMsg').innerHTML = who.id === pid ? `🥌 Du bist dran! Wisch nach oben. (${left} s)` : `🥌 ${nm(who.id)} (${who.side === 'A' ? 'Rot' : 'Blau'}) ist dran … ${left} s`;
        } else if(who && shots[cur]) $('#cuMsg').innerHTML = `🥌 ${nm(who.id)} schiebt …`;
        const sc = curlScore(cache.gl.map((g, i) => ({ ...g, x: pos[i] ? pos[i][0] : g.x, y: pos[i] ? pos[i][1] : g.y, off: pos[i] ? pos[i][2] : g.off })));
        ctx.fillStyle = '#FFF6E0'; ctx.font = '600 13px Rubik, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(sc ? (sc.side === 'A' ? 'Rot' : 'Blau') + ' führt mit ' + sc.pts : 'Noch keiner im Kreis', CW / 2, CH - 12);
      };
      loop(() => draw());
      const myTurn = () => { const R = room.round, w = order[R.cur || 0]; return w && w.id === pid && !curlShots(R)[R.cur || 0] && !R.pending; };
      cv.addEventListener('pointerdown', e => { e.preventDefault(); if(!myTurn()) return; dragging = true; track = [{ x: e.clientX, y: e.clientY, t: performance.now() }]; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
      cv.addEventListener('pointermove', e => { if(dragging) track.push({ x: e.clientX, y: e.clientY, t: performance.now() }); });
      const up = () => {
        if(!dragging) return; dragging = false;
        const tn = performance.now(), recent = track.filter(p => tn - p.t < 120), a = recent[0] || track[0], b = track[track.length - 1];
        const dt = Math.max(16, b.t - a.t), vx = (b.x - a.x) / dt / s * 5, vy = (b.y - a.y) / dt / s * 5;
        if(vy > -0.5 || !myTurn()) return;
        const m = Math.hypot(vx, vy), k = m > 13 ? 13 / m : 1;
        roomRef.child('round/pending').set({ vx: Math.round(vx * k * 1000) / 1000, vy: Math.round(vy * k * 1000) / 1000, by: pid });
      };
      cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    },
    eval(rows, r){
      const sim = curlSim(curlShots(r), curlShots(r).length, false), sc = curlScore(sim.gl), T2 = teamsOf(r);
      if(!sc) return { base: {}, rows: [], note: 'Kein Glas im Zielkreis – keiner trinkt' };
      const lose = sc.side === 'A' ? 'B' : 'A', base = {};
      T2[lose].forEach(id => base[id] = sc.pts);
      return { base, rows: [], noDouble: true, note: `${sc.side === 'A' ? 'Team Rot' : 'Team Blau'} holt ${sc.pts} ${sc.pts === 1 ? 'Punkt' : 'Punkte'}` };
    }
  }
});

/* Host-Logik der neuen Spiele */
let retteFirstOk = {};
function hostSpecial(r, t){
  const P = room.players || {};
  if(r.game === 'rette'){
    if(!r.remaining){ retteFirstOk = {}; roomRef.child('round').update({ step: 0, remaining: Object.keys(r.parts || {}), saved: [], stepAt: r.startAt }); return true; }
    if(r.remaining.length <= 1 || Object.keys(r.parts || {}).length < 2){ hostBusy = true; evaluate().finally(() => hostBusy = false); return true; }
    if(t < (r.stepAt || 0)) return true;
    const step = r.step || 0, A = ((room.answers && room.answers['r' + r.n]) || {})['s' + step] || {};
    const oks = Object.entries(A).filter(([id, a]) => a.ok && r.remaining.includes(id)).sort((a, b) => a[1].t - b[1].t);
    if(oks.length){
      if(!retteFirstOk[step]){ retteFirstOk[step] = t; return true; }
      if(t < retteFirstOk[step] + 450) return true;
      const w = oks[0][0];
      hostBusy = true;
      roomRef.child('round').update({ remaining: r.remaining.filter(id => id !== w), saved: (r.saved || []).concat(w), step: step + 1, stepAt: t + 1800, lastMsg: '🎉 ' + nameOf(w) + ' ist gerettet!' }).finally(() => hostBusy = false);
      return true;
    }
    if(r.remaining.every(id => A[id]) || t > r.stepAt + 12000){
      hostBusy = true;
      roomRef.child('round').update({ step: step + 1, stepAt: t + 1500, lastMsg: 'Keiner lag richtig – neuer Gegenstand!' }).finally(() => hostBusy = false);
    }
    return true;
  }
  if(r.game === 'schiffe'){
    const T2 = teamsOf(r);
    if(!T2.B.length){ hostBusy = true; evaluate().finally(() => hostBusy = false); return true; }
    if(!r.sub){ if(Object.keys(r.parts || {}).every(id => (r.ships || {})[id] != null)) shipsGo(true); return true; }
    if(r.over){ if(t >= (r.overAt || 0) + 2500){ hostBusy = true; evaluate().finally(() => hostBusy = false); } return true; }
    if(t < (r.turnAt || 0)) return true;
    const sh = shipShooter(r), pend = r.pending;
    if(pend && pend.by !== sh.id){ roomRef.child('round/pending').set(null); return true; }
    if(!pend && t < (r.turnAt || 0) + 10000) return true;
    const shots = shipShots(r), done = shots.filter(s => s.team === sh.target).map(s => s.cell);
    let cell = pend ? pend.cell : null;
    if(cell === null || done.includes(cell)){ const free = [...Array(16).keys()].filter(c => !done.includes(c)); cell = free[Math.floor(Math.random() * free.length)]; }
    const ships = r.ships || {};
    const hit = T2[sh.target].filter(id => ships[id] === cell);
    const allCells = done.concat(cell);
    const alive = T2[sh.target].filter(id => ships[id] != null && !allCells.includes(ships[id]));
    const up = {};
    up['shots/k' + shots.length] = { cell, team: sh.target, by: sh.id, hit };
    up.pending = null; up.turn = (r.turn || 0) + 1; up.turnAt = t + 1500;
    up.lastMsg = hit.length ? `💥 Treffer von ${nameOf(sh.id)}! ${hit.map(nameOf).join(' & ')} ${hit.length > 1 ? 'trinken' : 'trinkt'} 1!` : `💦 ${nameOf(sh.id)} schießt daneben${pend ? '' : ' (Zufallsschuss)'}`;
    if(!alive.length){ up.over = sh.target; up.overAt = t; }
    hostBusy = true; roomRef.child('round').update(up).finally(() => hostBusy = false);
    return true;
  }
  if(r.game === 'curling'){
    const order = curlOrder(r), T2 = teamsOf(r);
    if(!T2.B.length){ hostBusy = true; evaluate().finally(() => hostBusy = false); return true; }
    if(r.cur == null){ roomRef.child('round').update({ cur: 0, turnAt: r.startAt }); return true; }
    const cur = r.cur, shots = curlShots(r);
    if(cur >= order.length){ hostBusy = true; evaluate().finally(() => hostBusy = false); return true; }
    if(shots[cur]){
      const sim = curlSim(shots, cur + 1, true);
      if(t >= shots[cur].at + sim.frames.length * 16 + 1200){ hostBusy = true; roomRef.child('round').update({ cur: cur + 1, turnAt: t, pending: null }).finally(() => hostBusy = false); }
      return true;
    }
    const pend = r.pending, who = order[cur];
    if(pend && pend.by !== who.id){ roomRef.child('round/pending').set(null); return true; }
    if(pend || t >= (r.turnAt || 0) + 10000){
      const shot = pend ? { vx: pend.vx, vy: pend.vy } : { vx: Math.round((Math.random() - .5) * 1200) / 1000, vy: -Math.round((5.5 + Math.random() * 2.5) * 1000) / 1000 };
      hostBusy = true;
      roomRef.child('round').update({ ['shots/k' + cur]: { ...shot, side: who.side, id: who.id, at: Math.round(t + 300) }, pending: null }).finally(() => hostBusy = false);
    }
    return true;
  }
  return false;
}
function shipsGo(auto){
  const r = room.round; if(!r || r.game !== 'schiffe' || r.sub) return;
  if(!auto && !confirm('Jetzt losschießen? Wer noch kein Boot gesetzt hat, spielt ohne Boot mit.')) return;
  const T2 = teamsOf(r), ships = r.ships || {};
  const up = { sub: 'battle', first: Math.random() < .5 ? 'A' : 'B', turn: 0, turnAt: now() + 1500, lastMsg: 'Alle Boote gesetzt – Feuer frei!' };
  ['A', 'B'].forEach(s => { if(!T2[s].some(id => ships[id] != null)){ up.over = s; up.overAt = now(); up.lastMsg = (s === 'A' ? 'Team Rot' : 'Team Blau') + ' hat gar kein Boot gesetzt!'; } });
  roomRef.child('round').update(up);
}
