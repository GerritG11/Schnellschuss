<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141B33">
<title>Schnellschuss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#141B33; --panel:#1F2848; --line:#334070; --foam:#FFF6E0; --muted:#9AA3C7;
  --beer:#FFB627; --beer-d:#C98500; --red:#FF4D5E; --green:#22D37A; --blue:#3B82F6;
  --display: Bungee, Impact, "Arial Black", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--foam);
  font-family:Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.screen{display:none; min-height:100%; flex-direction:column; padding:20px; max-width:520px; margin:0 auto}
.screen.on{display:flex}
button{font-family:inherit; cursor:pointer; color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--beer); outline-offset:3px}

.logo{font-family:var(--display); line-height:.9; margin:8vh 0 6px; font-size:clamp(3rem,16vw,5rem); color:var(--beer); text-shadow:5px 5px 0 var(--red)}
.logo span{display:block}
.tag{color:var(--muted); margin:0 0 36px; font-size:1.05rem}

label{display:block; font-weight:600; margin:0 0 8px}
input{width:100%; font:600 1.2rem Rubik, sans-serif; color:var(--foam); background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:14px 16px}
input::placeholder{color:#6B759D}
.code-in{text-transform:uppercase; letter-spacing:.3em; text-align:center; font-family:var(--display); font-size:1.5rem}
.btn{display:block; width:100%; font-weight:800; font-size:1.15rem; border:0; border-radius:14px; padding:16px; background:var(--beer); color:var(--bg); box-shadow:0 5px 0 var(--beer-d); margin:14px 0 0; text-decoration:none; text-align:center}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--beer-d)}
.btn.ghost{background:transparent; color:var(--foam); box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:active{transform:translateY(2px)}
.btn.wa{background:var(--green); box-shadow:0 5px 0 #149356}
.or{display:flex; align-items:center; gap:12px; color:var(--muted); margin:28px 0 20px}
.or::before,.or::after{content:""; flex:1; height:2px; background:var(--line)}
.notice{background:#3A1F2E; border:2px solid var(--red); border-radius:14px; padding:14px; margin:0 0 20px; line-height:1.4}
.err{color:var(--red); min-height:1.4em; margin:10px 0 0; font-weight:600}

.lobby-code{font-family:var(--display); font-size:clamp(3.2rem,18vw,5rem); color:var(--beer); text-align:center; letter-spacing:.08em; margin:4vh 0 0}
.lobby-hint{text-align:center; color:var(--muted); margin:4px 0 24px}
.players{list-style:none; padding:0; margin:18px 0; display:flex; flex-wrap:wrap; gap:8px}
.players li{background:var(--panel); border-radius:999px; padding:9px 16px; font-weight:600}
.players li.off{opacity:.4}
.players li.host::after{content:" 👑"}
.muted{color:var(--muted)}
.spacer{flex:1}

#game{padding:12px 12px 16px}
.topbar{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.topbar .rnd{font-family:var(--display); color:var(--beer); font-size:1.1rem; flex:1}
.icon{background:var(--panel); color:var(--foam); border:0; border-radius:12px; min-width:46px; height:46px; font-size:1.25rem; font-weight:800; padding:0 12px}
#stage{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:62vh; user-select:none; -webkit-user-select:none}

.intro .gname{font-family:var(--display); font-size:clamp(2rem,10vw,3rem); color:var(--beer); line-height:1}
.intro .rule{font-size:1.25rem; max-width:20em; margin:16px auto 26px; line-height:1.45}
.intro .count{font-family:var(--display); font-size:6rem; color:var(--foam); animation:beat 1s infinite}

/* Warte auf Grün */
.pad{position:absolute; inset:0; border-radius:24px; display:flex; align-items:center; justify-content:center; touch-action:none}
.pad.red{background:var(--red)} .pad.green{background:var(--green)} .pad.dark{background:#2A3152}
.padtxt{font-family:var(--display); font-size:clamp(2.6rem,13vw,4.6rem); color:var(--bg); pointer-events:none}

/* Tipp die 7 */
.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(94vw,440px)}
.cell{aspect-ratio:1; border:0; border-radius:12px; background:var(--panel); color:var(--foam); font-family:var(--display); font-size:clamp(1.3rem,7vw,1.9rem); touch-action:none; padding:0}
.cell.hit{background:var(--green); color:var(--bg)} .cell.miss{background:var(--red)}

/* Großer Knopf */
.tapbig{width:min(68vw,280px); aspect-ratio:1; border-radius:50%; border:0; background:var(--beer); color:var(--bg); box-shadow:0 10px 0 var(--beer-d); display:flex; flex-direction:column; align-items:center; justify-content:center; touch-action:none}
.tapbig b{font-family:var(--display); font-size:clamp(2.4rem,14vw,4.6rem); line-height:1}
.tapbig small{font-weight:800; font-size:1.1rem}
.tapbig:active{transform:translateY(6px); box-shadow:0 4px 0 var(--beer-d)}

/* Maulwurf */
.holes{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:min(88vw,380px)}
.hole{aspect-ratio:1; border-radius:50%; border:0; background:#0C1124; box-shadow:inset 0 10px 0 #060914; position:relative; overflow:hidden; touch-action:none; padding:0}
.hole span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:clamp(2.2rem,12vw,3.2rem); transform:translateY(105%); transition:transform .07s; pointer-events:none}
.hole.up span{transform:none}
.hole.bonk{background:#1E6B47} .hole.miss{background:#5A2030}
.score-line{font-family:var(--display); color:var(--beer); font-size:1.6rem; margin-bottom:16px}

/* Bombe */
.task{font-size:1.35rem; font-weight:800; margin-bottom:24px}
.task b{font-family:var(--display); font-weight:400; font-size:1.6rem; display:block; margin-top:6px}
.wires{display:flex; flex-direction:column; gap:16px; width:min(88vw,400px)}
.wire{height:48px; border:0; border-radius:24px; touch-action:none; box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.wire.cut{opacity:.25}
.wire.boom{animation:shake .35s}

/* Bier zapfen */
.glass{position:relative; width:min(46vw,180px); height:min(48vh,320px); border:5px solid #E9EEF9; border-top:0; border-radius:0 0 28px 28px; overflow:hidden; background:rgba(255,255,255,.05); touch-action:none}
.fill{position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(#FFC94A,#E38E00)}
.fill::before{content:""; position:absolute; left:0; right:0; top:-12px; height:14px; background:var(--foam); border-radius:7px}
.fill.empty::before{display:none}
.mark{position:absolute; left:0; right:0; height:4px; margin-bottom:-2px; background:var(--red); z-index:2}
.hint{color:var(--muted); font-weight:600; margin-top:18px}

/* 10-Sekunden-Stopp */
.clock{font-family:var(--display); font-size:clamp(4rem,22vw,7rem); margin-bottom:28px; font-variant-numeric:tabular-nums}

/* Treffer-Zone */
.track{position:relative; width:min(90vw,420px); height:76px; background:var(--panel); border-radius:16px; margin-bottom:32px; overflow:hidden}
.zone{position:absolute; left:42%; width:16%; top:0; bottom:0; background:rgba(34,211,122,.28)}
.zone::after{content:""; position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--green)}
.needle{position:absolute; top:8px; bottom:8px; width:8px; margin-left:-4px; background:var(--beer); border-radius:4px}

/* Bierdeckel-Turm */
.tower{position:relative; width:260px; height:min(52vh,360px); overflow:hidden; border-bottom:4px solid var(--line); touch-action:none}
.tin{position:absolute; left:0; right:0; bottom:0; top:0; transition:transform .2s}
.coaster{position:absolute; height:20px; border-radius:6px; background:#E9D3A3; box-shadow:inset 0 -4px 0 #B88A45}
.coaster.mov{background:var(--beer); box-shadow:inset 0 -4px 0 var(--beer-d)}
.coaster.drop{background:#7A3040; opacity:.6; transition:transform .5s, opacity .5s}
.tstat{display:flex; gap:24px; font-family:var(--display); color:var(--beer); font-size:1.3rem; margin-bottom:10px}

/* Perfekter Kreis */
.cv{position:absolute; inset:0; width:100%; height:100%; touch-action:none; border-radius:24px; background:var(--panel)}
.cvhint{position:absolute; top:16px; left:0; right:0; color:var(--muted); font-weight:600; pointer-events:none}

/* Roter Knopf */
.btns4{display:grid; grid-template-columns:1fr 1fr; gap:16px; width:min(84vw,340px)}
.bigbtn{aspect-ratio:1; border:0; border-radius:26px; box-shadow:inset 0 -10px 0 rgba(0,0,0,.28); touch-action:none}
.bigbtn.picked{outline:6px solid var(--foam); outline-offset:3px}
.bigbtn.dim{opacity:.3}

/* Tauziehen */
.team-lbl{font-family:var(--display); font-size:1.5rem; margin-bottom:4px}
.team-mates{color:var(--muted); font-weight:600; margin-bottom:6px; max-width:22em}
.ropebar{position:relative; width:min(90vw,420px); height:14px; border-radius:7px; margin:22px 0 34px; background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%)}
.knot{position:absolute; top:50%; left:50%; width:36px; height:36px; margin:-18px 0 0 -18px; border-radius:50%; background:var(--foam); border:6px solid var(--bg); transition:left .3s}

/* Feedback & Ergebnis */
.fb{font-family:var(--display); font-size:clamp(2rem,10vw,3.4rem); margin-bottom:12px}
.fb.good{color:var(--green)} .fb.bad{color:var(--red); font-size:clamp(1.6rem,8vw,2.4rem)} .fb.meh{color:var(--beer); font-size:clamp(1.6rem,8vw,2.4rem)}
.wait p{margin:6px 0; font-size:1.1rem}
.wc{color:var(--muted)}
.result{width:100%}
.gsmall{color:var(--muted); font-weight:600; margin-bottom:8px}
.boom{font-family:var(--display); font-size:clamp(1.9rem,9vw,2.9rem); color:var(--beer); line-height:1.1; animation:pop .45s ease-out}
.sub{font-size:1.2rem; font-weight:600; margin-top:12px}
.note{color:var(--muted); font-weight:600; margin-top:8px}
.rows{list-style:none; padding:0; margin:22px 0 0; text-align:left}
.rows li{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-radius:12px; background:var(--panel); margin-bottom:6px; font-weight:600}
.rows li.l{background:#4A2133}
.rows li.f span:last-child{color:var(--red)}
.next{margin-top:18px; color:var(--muted)}

.board{display:none; position:fixed; inset:0; background:rgba(10,14,30,.92); z-index:5; padding:calc(20px + env(safe-area-inset-top,0)) 20px 20px}
.board.open{display:block}
.board-in{max-width:480px; margin:0 auto}
.board h2,.end h2{font-family:var(--display); color:var(--beer); font-weight:400; margin:0 0 16px}
.rank{list-style:none; padding:0; margin:0}
.rank li{display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:12px; padding:12px 14px; margin-bottom:6px; font-weight:600}
.rank .pos{font-family:var(--display); color:var(--muted); width:1.6em}
.rank .nm{flex:1}

.titles{display:grid; gap:10px; margin:0 0 24px}
.title-card{background:var(--panel); border-radius:16px; padding:14px 16px; border-left:6px solid var(--beer)}
.title-card .t{color:var(--muted); font-weight:600}
.title-card .w{font-family:var(--display); font-size:1.5rem; margin-top:2px}

@keyframes pop{0%{transform:scale(.6); opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1); opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)} 50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>

<section class="screen on" id="start">
  <h1 class="logo"><span>Schnell</span><span>schuss</span></h1>
  <p class="tag">Blitzschnelle Minispiele. Der Langsamste trinkt.</p>
  <div id="fbNotice"></div>
  <label for="nameIn">Dein Name</label>
  <input id="nameIn" maxlength="14" placeholder="z. B. Gerrit" autocomplete="off">
  <button class="btn" onclick="createRoom()">Raum erstellen</button>
  <div class="or">oder beitreten</div>
  <input id="codeIn" class="code-in" maxlength="4" placeholder="CODE" autocomplete="off">
  <button class="btn ghost" onclick="joinRoom()">Beitreten</button>
  <p class="err" id="startErr"></p>
</section>

<section class="screen" id="lobby">
  <div class="lobby-code" id="lobbyCode"></div>
  <p class="lobby-hint">Raumcode</p>
  <a class="btn wa" id="waBtn" target="_blank" rel="noopener">Per WhatsApp einladen</a>
  <button class="btn ghost" onclick="copyLink()" id="copyBtn">Link kopieren</button>
  <ul class="players" id="lobbyPlayers"></ul>
  <div class="spacer"></div>
  <div id="lobbyAction"></div>
  <button class="btn ghost" onclick="leaveRoom()">Raum verlassen</button>
</section>

<section class="screen" id="game">
  <div class="topbar" id="topbar"></div>
  <div id="stage"></div>
</section>

<section class="screen end" id="end"></section>

<div class="board" id="board" onclick="if(event.target===this)toggleBoard(false)">
  <div class="board-in">
    <h2>Rangliste</h2>
    <ol class="rank" id="boardList"></ol>
    <button class="btn ghost" onclick="toggleBoard(false)">Schließen</button>
  </div>
</div>

<script>
/* ===================== Firebase-Zugangsdaten ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyCK2kF3VewI_GvY82NtFh0yv4_erxzS6dg",
  authDomain: "schocken-das-spiel.firebaseapp.com",
  databaseURL: "https://schocken-das-spiel-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "schocken-das-spiel",
  storageBucket: "schocken-das-spiel.firebasestorage.app",
  messagingSenderId: "326846476225",
  appId: "1:326846476225:web:79e79a27e33b5fe7bd0940"
};
/* ================================================================ */

const INTRO_MS = 5000;   // Ansage vor jedem Minispiel
const RESULT_MS = 6500;  // Zeit zum Trinken, bevor die nächste Runde startet

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){ document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === id)); }
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ for(let i = arr.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const sec = ms => (ms / 1000).toFixed(2).replace('.', ',') + ' s';
const clean = o => JSON.parse(JSON.stringify(o));

/* ---------- Firebase ---------- */
let db = null, offset = 0;
const cfg = window.__ssConfig || firebaseConfig;
try{
  if(cfg.apiKey && window.firebase){
    firebase.initializeApp(cfg);
    db = firebase.database();
    db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  }
}catch(e){ console.error(e); }
if(!db) $('#fbNotice').innerHTML = '<div class="notice">Keine Verbindung zur Datenbank. Prüf deine Internetverbindung und lade die Seite neu.</div>';
const now = () => Date.now() + offset;
const TS = () => firebase.database.ServerValue.TIMESTAMP;

/* ---------- Zustand ---------- */
let pid = store.get('ss_pid');
if(!pid){ pid = 'p' + Math.random().toString(36).slice(2, 10); store.set('ss_pid', pid); }
let code = null, roomRef = null, room = null, isHost = false;
let viewKey = '', hostBusy = false, timers = [], rafs = [];
function clearTimers(){ timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; rafs.forEach(cancelAnimationFrame); rafs = []; }
const T = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
function loop(fn){ let alive = true; const step = t => { if(!alive) return; if(fn(t) === false){ alive = false; return; } const id = requestAnimationFrame(step); rafs.push(id); }; rafs.push(requestAnimationFrame(step)); }

$('#nameIn').value = store.get('ss_name') || '';
const urlCode = new URLSearchParams(location.search).get('raum');
if(urlCode) $('#codeIn').value = urlCode.toUpperCase();

function getName(){
  const n = $('#nameIn').value.trim();
  if(!n){ $('#startErr').textContent = 'Gib erst deinen Namen ein.'; $('#nameIn').focus(); return null; }
  store.set('ss_name', n); return n;
}
function newCode(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for(let i = 0; i < 4; i++) c += a[Math.floor(Math.random() * a.length)]; return c; }

/* ---------- Raum ---------- */
async function createRoom(){
  if(!db) return;
  const name = getName(); if(!name) return;
  let c, tries = 0;
  do { c = newCode(); tries++; } while((await db.ref('schnellschuss/rooms/' + c).once('value')).exists() && tries < 10);
  await db.ref('schnellschuss/rooms/' + c).set({
    meta: { host: pid, status: 'lobby', paused: false, created: TS() },
    players: { [pid]: { name, online: true, joined: TS(), drinks: 0, losses: 0, wins: 0 } }
  });
  enterRoom(c);
}
async function joinRoom(){
  if(!db) return;
  const name = getName(); if(!name) return;
  const c = $('#codeIn').value.trim().toUpperCase();
  if(c.length !== 4){ $('#startErr').textContent = 'Der Raumcode hat 4 Buchstaben.'; return; }
  const snap = await db.ref('schnellschuss/rooms/' + c).once('value');
  if(!snap.exists()){ $('#startErr').textContent = 'Diesen Raum gibt es nicht. Prüf den Code.'; return; }
  const r = snap.val();
  const ref = db.ref('schnellschuss/rooms/' + c + '/players/' + pid);
  if(r.players && r.players[pid]) await ref.update({ name, online: true });
  else await ref.set({ name, online: true, joined: TS(), drinks: 0, losses: 0, wins: 0 });
  enterRoom(c);
}
function enterRoom(c){
  code = c;
  roomRef = db.ref('schnellschuss/rooms/' + c);
  const me = roomRef.child('players/' + pid + '/online');
  me.onDisconnect().set(false);
  me.set(true);
  history.replaceState(null, '', location.pathname + '?raum=' + c);
  roomRef.on('value', s => { room = s.val(); onRoom(); });
  setInterval(hostTick, 400);
}
function leaveRoom(){ if(roomRef) roomRef.child('players/' + pid + '/online').set(false); location.href = location.pathname; }
function inviteLink(){ return location.origin + location.pathname + '?raum=' + code; }
function copyLink(){
  const t = inviteLink();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    () => { $('#copyBtn').textContent = 'Kopiert ✓'; setTimeout(() => $('#copyBtn').textContent = 'Link kopieren', 1500); },
    () => prompt('Link kopieren:', t)
  );
}

function onRoom(){
  if(!room || !room.meta){ alert('Der Raum wurde geschlossen.'); location.href = location.pathname; return; }
  const P = room.players || {};
  const h = P[room.meta.host];
  if(!h || !h.online){
    const next = Object.entries(P).filter(([, p]) => p.online).sort((a, b) => (a[1].joined || 0) - (b[1].joined || 0))[0];
    if(next && next[0] === pid) roomRef.child('meta/host').set(pid);
  }
  isHost = room.meta.host === pid;
  const st = room.meta.status;
  if(st === 'lobby') renderLobby();
  else if(st === 'playing') renderGame();
  else if(st === 'ended') renderEnd();
}

function renderLobby(){
  viewKey = ''; clearTimers(); show('lobby');
  $('#lobbyCode').textContent = code;
  $('#waBtn').href = 'https://wa.me/?text=' + encodeURIComponent('Komm in meine Schnellschuss-Runde 🍻 ' + inviteLink());
  const P = room.players || {};
  $('#lobbyPlayers').innerHTML = Object.entries(P).sort((a, b) => (a[1].joined || 0) - (b[1].joined || 0))
    .map(([id, p]) => `<li class="${p.online ? '' : 'off'} ${id === room.meta.host ? 'host' : ''}">${esc(p.name)}</li>`).join('');
  const n = Object.values(P).filter(p => p.online).length;
  $('#lobbyAction').innerHTML = isHost
    ? `<button class="btn" onclick="startGame()">Spiel starten (${n} Spieler)</button>`
    : `<p class="muted" style="text-align:center">Warte, bis der Host startet …</p>`;
}
function startGame(){ roomRef.child('meta').update({ status: 'playing', paused: false }); }

/* ===================== Minispiele ===================== */
const COLORS = [
  { n: 'ROTEN', c: '#FF4D5E', e: '🟥' }, { n: 'BLAUEN', c: '#3B82F6', e: '🟦' },
  { n: 'GELBEN', c: '#FFB627', e: '🟨' }, { n: 'GRÜNEN', c: '#22D37A', e: '🟩' }
];
function teamsOf(r){

        const top = stack[stack.length - 1];

        const shift = Math.max(0, stack.length * PH + PH * 3 - H);

  kreis: {
    title: 'Perfekter Kreis', rule: 'Mal mit dem Finger in einem Zug einen möglichst perfekten Kreis!', max: 12000, better: 'high',
    show: x => x.v.toFixed(1).replace('.', ',') + ' %',
    fb: res => res.fail ? `<div class="fb bad">😬 ${esc(res.why)}</div>` : `<div class="fb good">${res.v.toFixed(1).replace('.', ',')} % rund</div>`,
    run(el, r, done){
      el.innerHTML = '<canvas class="cv" id="cv"></canvas><div class="cvhint">Einmal rundherum malen</div>';
      const cv = $('#cv'), dpr = window.devicePixelRatio || 1;
      cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
      const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
      ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#FFB627';
      let pts = [], drawing = false, finished = false;
      const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
      cv.addEventListener('pointerdown', e => {
        e.preventDefault(); if(finished) return;
        drawing = true; pts = [pos(e)]; ctx.clearRect(0, 0, cv.width, cv.height); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        try{ cv.setPointerCapture(e.pointerId); }catch(_){}
      });
      cv.addEventListener('pointermove', e => {
        if(!drawing) return; const p = pos(e); pts.push(p); ctx.lineTo(p.x, p.y); ctx.stroke();
      });
      const up = () => {
        if(!drawing) return; drawing = false; finished = true;
        if(pts.length < 15){ done({ fail: true, why: 'kein Kreis' }); return; }
        const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length, cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
        const rs = pts.map(p => Math.hypot(p.x - cx, p.y - cy));
        const mean = rs.reduce((s, v) => s + v, 0) / rs.length;
        if(mean < 35){ done({ fail: true, why: 'viel zu klein' }); return; }
        const sd = Math.sqrt(rs.reduce((s, v) => s + (v - mean) ** 2, 0) / rs.length);
        let turn = 0;
        for(let i = 1; i < pts.length; i++){
          let d = Math.atan2(pts[i].y - cy, pts[i].x - cx) - Math.atan2(pts[i-1].y - cy, pts[i-1].x - cx);
          if(d > Math.PI) d -= 2 * Math.PI; if(d < -Math.PI) d += 2 * Math.PI; turn += d;
        }
        const cover = Math.min(1, Math.abs(turn) / (2 * Math.PI));
        const gap = Math.hypot(pts[0].x - pts[pts.length-1].x, pts[0].y - pts[pts.length-1].y) / mean;
        const closePen = gap > 0.4 ? Math.max(0.6, 1 - (gap - 0.4) * 0.4) : 1;
        let score = Math.max(0, 1 - (sd / mean) * 2.2) * cover * closePen * 100;
        score = Math.min(99.9, Math.round(score * 10) / 10);
        ctx.strokeStyle = 'rgba(34,211,122,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, mean, 0, Math.PI * 2); ctx.stroke();
        T(() => done({ v: score }), 700);
      };
      cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
      T(() => { if(!finished){ finished = true; drawing = false; done({ fail: true, why: 'kein Kreis' }); } }, 10000);
    }
  },

      const { A, B } = teamsOf(r);
      const sum = ids => ids.reduce((s, id) => { const x = rows.find(y => y.id === id); return s + ((x && x.taps) || 0); }, 0);
      const sa = sum(A), sb = sum(B);
      rows.forEach(x => { x.v = x.taps || 0; if(x.fail) x.why = 'keine Reaktion'; });
      rows.sort((a, b) => (b.taps || 0) - (a.taps || 0));
      let losers = [];
      if(B.length && sa !== sb) losers = sa < sb ? A : B;
      return { losers, winner: null, gives: 0, rows, note: `🟥 Team Rot ${sa} : ${sb} Team Blau 🟦` };
    }
  }
};

function valText(game, row){ const g = GAMES[game]; return g.show ? g.show(row) : row.v + ' ms'; }
function defaultEval(rows, g){
  const ok = rows.filter(x => !x.fail), fails = rows.filter(x => x.fail);
  const hi = g.better === 'high';
  ok.sort((a, b) => hi ? b.v - a.v : a.v - b.v);
  let losers = [];
  if(fails.length) losers = fails.map(x => x.id);
  else if(ok.length > 1){
    const worst = ok[ok.length - 1].v;
    losers = ok.filter(x => x.v === worst).map(x => x.id);
    if(losers.length === ok.length) losers = [];
  }
  const winner = (ok.length && rows.length > 1 && !losers.includes(ok[0].id)) ? ok[0].id : null;
  return { losers, winner, gives: winner ? (g.gives || 0) : 0, rows: ok.concat(fails) };
}

/* ===================== Host-Steuerung ===================== */
function hostTick(){
  if(!isHost || !room || room.meta.status !== 'playing' || hostBusy) return;
  const r = room.round, t = now();
  if(!r || (r.phase === 'result' && t >= (r.resultAt || 0) + RESULT_MS)){
    if(room.meta.paused) return;
    hostBusy = true; startRound().finally(() => hostBusy = false); return;
  }
  if(r.phase === 'play'){
    const parts = Object.keys(r.parts || {});
    const ans = (room.answers && room.answers['r' + r.n]) || {};
    const all = parts.length > 0 && parts.every(p => ans[p]);
    if(all || t >= r.startAt + GAMES[r.game].max + 1500){
      hostBusy = true; evaluate().finally(() => hostBusy = false);
    }
  }
}
async function startRound(){
  const r = room.round, n = (r ? r.n : 0) + 1;
  const keys = Object.keys(GAMES);
  const recent = (room.meta.recent || '').split(',').filter(Boolean);
  let choices = keys.filter(k => !recent.includes(k)); if(!choices.length) choices = keys;
  const g = choices[Math.floor(Math.random() * choices.length)];
  const newRecent = recent.concat(g).slice(-5).join(',');
  const parts = {};
  Object.entries(room.players || {}).forEach(([id, p]) => { if(p.online) parts[id] = true; });
  await roomRef.update({
    round: { n, game: g, seed: Math.floor(Math.random() * 1e9), startAt: now() + INTRO_MS, phase: 'play', parts },
    'meta/recent': newRecent, answers: null, live: null
  });
}
async function evaluate(){
  const r = room.round, g = GAMES[r.game];
  const ans = (room.answers && room.answers['r' + r.n]) || {};
  const rows = Object.keys(r.parts || {}).map(id => {
    const a = ans[id];
    return a ? Object.assign({ id }, a, { fail: !!a.fail }) : { id, fail: true, why: 'keine Reaktion' };
  });
  const res = g.eval ? g.eval(rows, r) : defaultEval(rows, g);
  const P = room.players || {}, up = {};
  res.losers.forEach(id => {
    if(!P[id]) return;
    up['players/' + id + '/drinks'] = (P[id].drinks || 0) + 1;
    up['players/' + id + '/losses'] = (P[id].losses || 0) + 1;
  });
  if(res.winner && P[res.winner]){
    up['players/' + res.winner + '/wins'] = (P[res.winner].wins || 0) + 1;
    if(r.game === 'gruen'){
      const v = res.rows[0].v, best = P[res.winner].best;
      if(best == null || v < best) up['players/' + res.winner + '/best'] = v;
    }
  }
  up['round/phase'] = 'result';
  up['round/resultAt'] = now();
  up['round/result'] = clean(res);
  await roomRef.update(up);
}
function togglePause(){ roomRef.child('meta/paused').set(!room.meta.paused); }
function endGame(){ if(confirm('Spiel wirklich beenden und zur Siegerehrung?')) roomRef.child('meta').update({ status: 'ended', paused: false }); }
function newGame(){
  const up = { 'meta/status': 'lobby', 'meta/paused': false, 'meta/recent': null, round: null, answers: null, live: null };
  Object.keys(room.players || {}).forEach(id => {
    up['players/' + id + '/drinks'] = 0; up['players/' + id + '/losses'] = 0;
    up['players/' + id + '/wins'] = 0;   up['players/' + id + '/best'] = null;
  });
  roomRef.update(up);
}

/* ===================== Spielbildschirm ===================== */
function renderGame(){
  show('game');
  const r = room.round;
  $('#topbar').innerHTML =
    `<div class="rnd">${r ? 'Runde ' + r.n : 'Los geht’s'}</div>
     <button class="icon" onclick="toggleBoard(true)" aria-label="Rangliste">🏆</button>` +
    (isHost ? `<button class="icon" onclick="togglePause()" aria-label="Pause">${room.meta.paused ? '▶' : '⏸'}</button>
               <button class="icon" onclick="endGame()" aria-label="Spiel beenden">Ende</button>` : '');
  renderBoard();
  const key = r ? r.n + '-' + r.phase : 'wait';
  if(key !== viewKey){
    viewKey = key; clearTimers();
    const stage = $('#stage');
    if(!r) stage.innerHTML = '<div class="intro"><div class="gname">Gleich geht’s los …</div></div>';
    else if(r.phase === 'play') playRound(r);
    else showResult(r);
  }
  updateLive();
}

function myAnswer(r){ return room.answers && room.answers['r' + r.n] && room.answers['r' + r.n][pid]; }
function waitHTML(msg){ return `<div class="wait">${msg ? '<p>' + msg + '</p>' : ''}<p class="wc">Warte auf die anderen … <b id="wc"></b></p></div>`; }
function feedbackHTML(game, res){
  const g = GAMES[game];
  if(g.fb) return g.fb(res);
  return res.fail ? `<div class="fb bad">😬 ${esc(res.why)}</div>` : `<div class="fb good">${valText(game, res)}</div>`;
}

function playRound(r){
  const g = GAMES[r.game], stage = $('#stage');
  if(!r.parts || !r.parts[pid]){ stage.innerHTML = waitHTML('Du steigst nächste Runde ein 🍻'); return; }
  const prev = myAnswer(r);
  if(prev){ stage.innerHTML = feedbackHTML(r.game, prev) + waitHTML(''); return; }
  let sent = false;
  const done = res => {
    if(sent) return; sent = true; clearTimers();
    roomRef.child('answers/r' + r.n + '/' + pid).set(clean(res));
    if(r.game === 'tauziehen') roomRef.child('live/r' + r.n + '/' + pid).set(res.taps || 0);
    T(() => { stage.innerHTML = feedbackHTML(r.game, res) + waitHTML(''); updateLive(); }, 450);
  };
  stage.innerHTML = `<div class="intro"><div class="gname">${g.title}</div><p class="rule">${g.rule}</p><div class="count" id="cd"></div></div>`;
  const tick = () => {
    const left = r.startAt - now();
    if(left <= 0){
      clearTimers();
      if(now() > r.startAt + g.max){ done({ fail: true, why: 'zu spät' }); return; }
      stage.innerHTML = '';
      g.run(stage, rng(r.seed), done, r);
    } else {
      const el = $('#cd'); if(el) el.textContent = Math.ceil(left / 1000);
    }
  };
  timers.push(setInterval(tick, 80)); tick();
}

function showResult(r){
  const res = r.result || { losers: [], rows: [] };
  const nm = id => esc(nameOf(id));
  const L = res.losers || [];
  const head = L.length ? `💥 ${L.map(nm).join(' & ')} ${L.length > 1 ? 'trinken' : 'trinkt'} 1!` : '🍀 Diesmal trinkt keiner';
  let sub = '';
  if(res.winner) sub = res.gives ? `🎯 ${nm(res.winner)} verteilt ${res.gives} Schlücke` : `⚡ Am besten: ${nm(res.winner)}`;
  const rows = (res.rows || []).map(x =>
    `<li class="${x.fail ? 'f' : ''} ${L.includes(x.id) ? 'l' : ''}"><span>${nm(x.id)}</span><span>${x.fail ? esc(x.why || '–') : esc(valText(r.game, x))}</span></li>`).join('');
  $('#stage').innerHTML = `<div class="result"><div class="gsmall">${GAMES[r.game].title}</div><div class="boom">${head}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${res.note ? `<div class="note">${esc(res.note)}</div>` : ''}<ol class="rows">${rows}</ol><div class="next" id="nx"></div></div>`;
}

function updateLive(){
  const r = room && room.round; if(!r) return;
  const wc = $('#wc');
  if(wc){
    const parts = Object.keys(r.parts || {});
    const ans = (room.answers && room.answers['r' + r.n]) || {};
    wc.textContent = parts.filter(p => ans[p]).length + '/' + parts.length;
  }
  const knot = $('#knot');
  if(knot && r.game === 'tauziehen'){
    const live = (room.live && room.live['r' + r.n]) || {};
    const { A, B } = teamsOf(r);
    const s = ids => ids.reduce((t, id) => t + (live[id] || 0), 0);
    const a = s(A), b = s(B);
    knot.style.left = (50 - ((a - b) / (a + b + 4)) * 45) + '%';
  }
  const nx = $('#nx');
  if(nx) nx.textContent = room.meta.paused ? '⏸ Pause – der Host macht gleich weiter' : 'Nächste Runde gleich …';
}

function sortedPlayers(){ return Object.entries(room.players || {}).sort((a, b) => (b[1].drinks || 0) - (a[1].drinks || 0)); }
function renderBoard(){
  $('#boardList').innerHTML = sortedPlayers().map(([id, p], i) =>
    `<li><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}${id === pid ? ' (du)' : ''}</span><span>🍺 ${p.drinks || 0}</span></li>`).join('');
}
function toggleBoard(open){ $('#board').classList.toggle('open', open); }

/* ===================== Ende ===================== */
function renderEnd(){
  viewKey = ''; clearTimers(); toggleBoard(false); show('end');
  const list = sortedPlayers();
  const ent = Object.entries(room.players || {});
  const thirsty = ent.filter(([, p]) => (p.drinks || 0) > 0).sort((a, b) => b[1].drinks - a[1].drinks)[0];
  const fastest = ent.filter(([, p]) => p.best != null).sort((a, b) => a[1].best - b[1].best)[0];
  const winner = ent.filter(([, p]) => (p.wins || 0) > 0).sort((a, b) => b[1].wins - a[1].wins)[0];
  const card = (t, w) => `<div class="title-card"><div class="t">${t}</div><div class="w">${w}</div></div>`;
  $('#end').innerHTML = `
    <h1 class="logo" style="margin-top:4vh;font-size:clamp(2.4rem,12vw,3.6rem)"><span>Siegerehrung</span></h1>
    <div class="titles">
      ${fastest ? card('⚡ Schnellster Finger', esc(fastest[1].name) + ' · ' + fastest[1].best + ' ms') : ''}
      ${winner ? card('🏅 Die meisten Siege', esc(winner[1].name) + ' · ' + winner[1].wins) : ''}
      ${thirsty ? card('🍺 Durstigster Spieler', esc(thirsty[1].name) + ' · ' + thirsty[1].drinks + ' Schlücke') : ''}
    </div>
    <h2>Endstand</h2>
    <ol class="rank">${list.map(([id, p], i) => `<li><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}</span><span>🍺 ${p.drinks || 0}</span></li>`).join('')}</ol>
    <div class="spacer"></div>
    ${isHost ? '<button class="btn" onclick="newGame()">Neues Spiel</button>' : '<p class="muted" style="text-align:center;margin-top:20px">Der Host kann ein neues Spiel starten.</p>'}
    <button class="btn ghost" onclick="leaveRoom()">Raum verlassen</button>`;
}
</script>
</body>
</html>
